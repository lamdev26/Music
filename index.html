<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi Visualizer Pro — Direct Render Beat FX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=Playfair+Display:wght@700;900&family=Archivo+Black&family=Caveat:wght@700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<script>
window.addEventListener('beforeunload',e=>{
  if(typeof directRendering!=='undefined' && directRendering){
    e.preventDefault();
    e.returnValue='Render đang chạy. Có thể chuyển tab/minimize, nhưng không được đóng hoặc reload trang.';
    return e.returnValue;
  }
});
</script>
<style>
  :root{
    --bg:#0a0a10; --panel:#131320; --panel2:#191927; --line:#26263a;
    --text:#eceaf5; --muted:#8d8ba3; --accent:#7c5cff; --accent2:#34e4c1;
    --warn:#ff6b6b; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
  h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#2a2a3d;border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{display:flex;flex-direction:column;height:100vh;}

  header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
  .logo{font-weight:700;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.6);opacity:.5;}}
  header .spacer{flex:1;}
  
  .btn-proj{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;}
  .btn-proj:hover{border-color:var(--accent2);color:var(--accent2);}

  .segbtn-group{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:2px;}
  .segbtn{border:none;background:transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600;}
  .segbtn.active{background:var(--accent);color:#fff;}
  
  .btn-record{background:linear-gradient(135deg,#e11d48,#be123c);border:none;color:#fff;padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(225,29,72,.35);transition:0.2s all;}
  .btn-record:hover{filter:brightness(1.1);}
  .btn-record.recording{background:linear-gradient(135deg,#9f1239,#881337);animation:recordPulse 1.2s infinite alternate;}
  @keyframes recordPulse{0%{opacity:1;transform:scale(1);}100%{opacity:0.8;transform:scale(0.98);}}

  #main{flex:1;display:flex;min-height:0;}
  #tabrail{width:76px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 0;flex-shrink:0;}
  .tabbtn{background:none;border:none;color:var(--muted);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-size:10px;font-weight:600;border-left:3px solid transparent;}
  .tabbtn svg{width:20px;height:20px;}
  .tabbtn.active{color:var(--text);border-left:3px solid var(--accent);background:var(--panel2);}
  .tabbtn:hover:not(.active){color:var(--text);}

  #sidepanel{width:380px;background:var(--panel2);border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0;padding:16px;}
  #sidepanel h3{margin:0 0 4px;font-size:14px;}
  #sidepanel .hint{color:var(--muted);font-size:11.5px;margin:0 0 14px;line-height:1.5;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field select,.field textarea{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:7px;font-size:13px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:90px;line-height:1.5;}
  .row2{display:flex;gap:8px;}
  .row2 > .field{flex:1;}
  .field input[type=color]{width:44px;height:32px;padding:2px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;}
  .field input[type=range]{width:100%;accent-color:var(--accent);}
  .rangeval{font-size:11px;color:var(--accent2);float:right;font-weight:600;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);margin-bottom:10px;}
  .btn-sm{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;font-weight:600;}
  .btn-sm:hover{border-color:var(--accent);}
  .btn-primary-sm{background:var(--accent);border:1px solid var(--accent);color:#fff;padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-weight:600;}
  .divider{height:1px;background:var(--line);margin:16px 0;}

  .dropzone{border:2px dashed var(--line);border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;color:var(--muted);font-size:12px;transition:.15s;}
  .dropzone:hover{border-color:var(--accent);color:var(--text);}
  .dropzone svg{width:24px;height:24px;margin-bottom:4px;opacity:.7;}

  .beatinfo{display:flex;gap:10px;margin-top:10px;}
  .beatstat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center;}
  .beatstat .num{font-family:'Space Grotesk';font-size:19px;font-weight:700;color:var(--accent2);}
  .beatstat .lbl{font-size:10px;color:var(--muted);margin-top:2px;}

  .batch-box{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px;}
  .batch-box .title{font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:5px;}

  .imglist{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .imgitem{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;align-items:center;cursor:grab;}
  .imgitem.dragging{opacity:.4;}
  .imgitem.selected{border-color:var(--accent);}
  .imgitem img{width:48px;height:48px;object-fit:cover;border-radius:6px;flex-shrink:0;}
  .imgitem .meta{flex:1;min-width:0;}
  .imgitem .meta .headrow{display:flex;justify-content:space-between;align-items:center;}
  .imgitem .meta .idx{font-size:10px;color:var(--muted);font-weight:700;}
  .imgitem .meta select{width:100%;font-size:11px;padding:4px 6px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:5px;margin-top:4px;}
  .durrow{display:flex;align-items:center;gap:5px;margin-top:5px;}
  .durrow input{width:54px;font-size:11px;padding:3px 5px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:5px;}
  .durrow span{font-size:10px;color:var(--muted);}
  .imgitem .rm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 5px;flex-shrink:0;}
  .imgitem .rm:hover{color:var(--warn);}

  .effectgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
  .effcard{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;cursor:pointer;font-size:11.5px;text-align:center;font-weight:600;transition:.12s;}
  .effcard:hover{border-color:var(--accent);color:#fff;}
  .effcard.active{border-color:var(--accent2) !important;color:var(--accent2) !important;background:rgba(52,228,193,.12) !important;}

  #stage{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at 50% 30%,#161622,#0a0a10);}
  #canvaswrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;padding:20px;}
  #previewCanvas{background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:4px;max-width:100%;max-height:100%;cursor:grab;}
  #previewCanvas.panning{cursor:grabbing;}
  .stagehint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);backdrop-filter:blur(6px);padding:6px 14px;border-radius:20px;font-size:11.5px;color:var(--accent2);pointer-events:none;border:1px solid var(--line);}

  #transport{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);background:var(--panel);flex-shrink:0;}
  #playBtn{width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #playBtn svg{width:15px;height:15px;}
  .timecode{font-family:'Space Grotesk';font-size:12px;color:var(--muted);width:100px;text-align:center;flex-shrink:0;}
  #timeline{flex:1;height:56px;position:relative;background:var(--panel2);border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--line);}
  #timeline canvas{width:100%;height:100%;display:block;}
  #playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent2);box-shadow:0 0 8px var(--accent2);pointer-events:none;}

  .empty-state{text-align:center;color:var(--muted);padding:40px 16px;font-size:12.5px;}

  #recordNotification{
    position:absolute;top:20px;left:50%;transform:translateX(-50%);
    background:rgba(225,29,72,0.9);color:#fff;padding:8px 18px;border-radius:30px;
    font-size:12px;font-weight:700;display:none;align-items:center;gap:8px;
    box-shadow:0 0 20px rgba(225,29,72,0.5);z-index:90;backdrop-filter:blur(4px);
  }
  #recordNotification .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 0.8s infinite alternate;}
  #backgroundRenderBadge{pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  #directRenderOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,5,12,.60);z-index:95;backdrop-filter:blur(5px)}
  #directRenderOverlay .renderbox{width:min(470px,88%);background:rgba(19,19,32,.97);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
  .render-title{font-weight:800;font-size:14px;margin-bottom:5px}.render-sub{font-size:11.5px;color:var(--muted);margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .render-track{height:10px;background:#0d0d16;border:1px solid var(--line);border-radius:20px;overflow:hidden}
  #renderProgressFill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .render-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--accent2);font-weight:700;margin:8px 0 12px}


/* ---------- STANDALONE SHORT MUSIC CUTTER ---------- */
  #shortCutPanel{display:block}
  .sc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sc-badge{font-size:10px;color:var(--accent2);border:1px solid var(--line);padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.03);white-space:nowrap}
  .sc-wave{height:108px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border-radius:10px;overflow:hidden;position:relative;margin:10px 0 8px}
  .sc-wave canvas{width:100%;height:100%;display:block}
  .sc-selection{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent);border-right:2px solid var(--accent2);background:rgba(56,189,248,.12);pointer-events:none}
  .sc-marker{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.9;pointer-events:none;box-shadow:0 0 8px rgba(255,255,255,.35)}
  .sc-timebar{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-bottom:10px}
  .sc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sc-num{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 9px;font-size:12px;outline:none}
  .sc-num:focus{border-color:var(--accent)}
  .sc-presets{display:flex;flex-wrap:wrap;gap:6px}
  .sc-presets button{flex:1;min-width:54px}
  .sc-status{font-size:10.5px;line-height:1.45;color:var(--muted);margin-top:8px;min-height:28px}
  .sc-drop{border:1px dashed var(--line);padding:14px 10px;border-radius:10px;text-align:center;color:var(--muted);cursor:pointer;background:rgba(255,255,255,.015)}
  .sc-drop:hover{border-color:var(--accent);color:var(--text)}
  .sc-mini{font-size:10px;color:var(--muted);line-height:1.45}
  .sc-fadebox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .sc-checkline{display:flex;align-items:center;gap:7px;color:var(--text);font-size:11px;padding:8px 0}
  .sc-checkline input{accent-color:var(--accent)}
  .sc-mp4btn{width:100%;margin-top:8px}
  /* ---------- BEAT-SYNC WEATHER FX (ADD-ON ONLY) ---------- */
  .weather-panel-note{font-size:10.5px;color:var(--muted);line-height:1.45;margin:-4px 0 12px;}
  .weather-status{font-size:10.5px;color:var(--accent2);margin-top:8px;min-height:18px;}

</style>

.batch-box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#ff7a00,#ffc783,transparent);opacity:.75;}
.imgitem{border-radius:10px;padding:9px;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;}
.imgitem:hover{transform:translateY(-1px);}
.imgitem.selected{transform:translateY(-1px);}
.effcard{border-radius:10px;padding:9px 7px;min-height:42px;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;isolation:isolate;background:radial-gradient(circle at 50% 28%,rgba(255,122,0,.075),transparent 25%),linear-gradient(180deg,#0b0908,#050504);}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 45%,rgba(255,122,0,.035),transparent 38%);}
#canvaswrap{padding:24px;background:radial-gradient(ellipse at center,rgba(255,122,0,.05),transparent 42%);}
#previewCanvas{border-radius:8px;box-shadow:0 34px 100px rgba(0,0,0,.78),0 0 0 1px rgba(255,169,93,.12),0 0 54px rgba(255,122,0,.035);}
#transport{padding:11px 18px;background:linear-gradient(180deg,#11100e,#080706);border-top-color:rgba(255,145,65,.18);}
#playBtn{width:40px;height:40px;border:1px solid rgba(255,210,160,.20);}
#timeline{height:60px;border-radius:10px;border-color:#3e2a1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 8px 28px rgba(0,0,0,.22);}
#timeline::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;border:1px solid rgba(255,175,95,.04);}
#playhead{width:2px;background:linear-gradient(180deg,#fff0d8,#ffae55,#ff6c00);box-shadow:0 0 10px #ff7a00,0 0 25px rgba(255,122,0,.35);}
.stagehint{border-radius:999px;padding:7px 15px;backdrop-filter:blur(10px);}
#directRenderOverlay{backdrop-filter:blur(7px);}
#directRenderOverlay .renderbox{border-radius:16px;padding:20px;border-color:rgba(255,155,85,.20);}
.render-title{letter-spacing:.35px;color:#fff5ec;}
.render-track{height:11px;border-radius:999px;box-shadow:inset 0 1px 3px rgba(0,0,0,.65);}
#renderProgressFill{background:linear-gradient(90deg,#e95a00,#ff8b26,#ffd08f);}
/* scrollbars / select polish */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#5a3823,#2e2119);border:2px solid transparent;background-clip:padding-box;border-radius:999px;}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#8b4b1c,#4a2f1d);border:2px solid transparent;background-clip:padding-box;}
select{cursor:pointer;}
select option{background:#110d0a;color:#f2e8df;}
/* ---------- VINYL RECORD ADD-ON — GROUPED DISC + COUNTDOWN ---------- */
.vinyl-preview{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #3c291e;border-radius:10px;background:linear-gradient(180deg,#120e0b,#090807);}
.vinyl-preview img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#050505;border:2px solid #2c241f;box-shadow:0 0 12px rgba(0,0,0,.45);}
.vinyl-preview .vp-meta{min-width:0;flex:1;}
.vinyl-preview .vp-title{font-size:11px;font-weight:800;color:#ffc27d;margin-bottom:3px;}
.vinyl-preview .vp-sub{font-size:10px;color:#9f9185;line-height:1.45;}
.vinyl-clear{margin-top:7px;width:100%;}
.vinyl-tip{font-size:10.5px;color:#a7978b;line-height:1.45;margin-top:7px;}
/* Vinyl PRO MAX 2.0 — visual controls live only in the Vinyl tab. */
.vinyl-style-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:6px;}
.vinyl-style-card{position:relative;min-width:0;min-height:70px;padding:6px 5px;border:1px solid #3c2b20;border-radius:10px;background:linear-gradient(180deg,#14110f,#0a0908);cursor:pointer;text-align:center;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease;}
.vinyl-style-card:hover{transform:translateY(-1px);border-color:#6b4529;}
.vinyl-style-card.active{border-color:#ff9a36;box-shadow:0 0 0 1px rgba(255,154,54,.18),0 0 22px rgba(255,122,0,.10),inset 0 0 18px rgba(255,122,0,.04);}
.vinyl-style-card .mini-record{width:40px;height:40px;border-radius:50%;margin:0 auto 4px;border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 0 0 4px rgba(0,0,0,.5),inset 0 0 0 6px rgba(255,255,255,.07),0 4px 12px rgba(0,0,0,.45);position:relative;overflow:hidden;}
.vinyl-style-card .mini-record::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 2px rgba(0,0,0,.36) inset;}
.vinyl-style-card .mini-classic{background:repeating-radial-gradient(circle at 50% 50%,#111 0 1px,#080808 2px 3px);}
.vinyl-style-card .mini-glossy{background:radial-gradient(circle at 30% 25%,#5b5b5b 0%,#1b1b1b 28%,#070707 72%,#1d1d1d 100%);box-shadow:inset 0 0 0 4px rgba(0,0,0,.5),inset 0 0 22px rgba(255,255,255,.10),0 0 12px rgba(255,170,88,.13);}
.vinyl-style-card .mini-chrome{background:radial-gradient(circle at 28% 18%,#fff 0%,#777 16%,#1b1b1b 34%,#e7e7e7 46%,#3b3b3b 53%,#090909 76%,#a5a5a5 100%);box-shadow:inset 0 0 0 4px rgba(0,0,0,.55),0 0 14px rgba(220,230,255,.16);}
.vinyl-style-card .mini-label{font-size:9px;font-weight:800;color:#d7cbc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vinyl-section-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#d2c4b8;font-weight:800;margin:4px 0 3px;}
.vinyl-probox{padding:8px;border:1px solid rgba(255,145,65,.10);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(0,0,0,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.02);}
.vinyl-tip strong{color:#e8d5c3;}
.vinyl-finish-note{margin-top:6px;padding:7px 8px;border-radius:8px;color:#8f8a9e;font-size:9.5px;line-height:1.4;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008));border:1px solid rgba(255,255,255,.04);}

/* subtle luxury accents on common cards */
.sc-badge,.sc-wave,.sc-drop{border-radius:11px;}
.sc-badge{background:linear-gradient(180deg,rgba(255,122,0,.06),rgba(255,122,0,.018));}
.sc-wave{box-shadow:inset 0 1px 0 rgba(255,255,255,.018),0 8px 24px rgba(0,0,0,.16);}

  top:{heights:new Float32Array(TOTAL_PEAK_BARS).fill(0),lastT:-1,style:'',dt:1/30,firstFrame:true},

    await ve.flush();ve.close();ve=null;

    const rate=ab.sampleRate,ch=ab.numberOfChannels,s=Math.floor(start*rate),e=Math.floor(end*rate),nf=1024;
    for(let off=s;off<e;off+=nf){
      if(directRenderAbort)throw new Error('__STOP__');
      const n=Math.min(nf,e-off),planar=new Float32Array(n*ch),localBase=(off-s)/rate;
      const gainEnd=(idx)=>shortCutGainAt(localBase+idx/rate,total,fade.fadeIn,fade.fadeOut);
      for(let c=0;c<ch;c++){const src=ab.getChannelData(c);const dstOffset=c*n;for(let i=0;i<n;i++)planar[dstOffset+i]=(src[off+i]||0)*gainEnd(i);}
      const ad=new AudioData({format:'f32-planar',sampleRate:rate,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round((off-s)/rate*1e6),data:planar});
      ae.encode(ad);ad.close();if(ae.encodeQueueSize>8)await uiYield();
      if(off%(nf*32)===s%(nf*32))renderUI(82+(off-s)/(e-s)*15,`Mã hóa audio Short AAC ${Math.round((off-s)/(e-s)*100)}%`,'00:01');
    }
    await ae.flush();ae.close();ae=null;renderUI(98,'Đóng gói Short MP4...','00:01');await uiYield();muxer.finalize();
    const blob=new Blob([target.buffer],{type:'video/mp4'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);
    const base=(shortCutState.name||'music').replace(/\.[^/.]+$/,'').replace(/[\\/:*?"<>|]/g,'_');a.download=`${base}_Short_${Math.round(start)}s-${Math.round(end)}s.mp4`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    renderUI(100,'Hoàn tất — Short MP4 giữ toàn bộ FX','DONE');
    const st=document.getElementById('shortCutStatus');if(st)st.textContent=`Đã xuất Short MP4 ${shortFmt(start)} → ${shortFmt(end)} • toàn bộ FX hiện tại • Fade in ${fade.fadeIn.toFixed(1)}s / Fade out ${fade.fadeOut.toFixed(1)}s.`;
    await new Promise(r=>setTimeout(r,700));
    document.getElementById('audioEl').currentTime=oldTime;if(wasPlaying){await document.getElementById('audioEl').play().catch(()=>{});state.playing=true;loopRender();}
  }catch(e){
    if(ve){try{ve.close()}catch(_){}}if(ae){try{ae.close()}catch(_){}}
    if(e.message==='__STOP__')alert('Đã dừng xuất Short MP4.');else{console.error(e);alert('Xuất Short MP4 lỗi: '+e.message);}
  }finally{
    directWaveBufferOverride=null;
    directRendering=false;directRenderAbort=false;renderInBackground=false;showBackgroundRenderBadge(false);overlay.style.display='none';
  }
}

function updateBeatInfoBox(wrap){
  const box = wrap.querySelector('#beatInfoWrap');
  if(!state.audio.buffer){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="beatinfo">
    <div class="beatstat"><div class="num">${state.audio.bpm||'--'}</div><div class="lbl">BPM</div></div>
    <div class="beatstat"><div class="num">${state.audio.beats.length}</div><div class="lbl">Nhịp phát hiện</div></div>
    <div class="beatstat"><div class="num">${fmtTime(state.audio.duration)}</div><div class="lbl">Thời lượng</div></div>
  </div>`;
}

function avgBeatInterval(){
  const b=state.audio.beats; if(b.length<2) return 60/(state.audio.bpm||120);
  let sum=0; for(let i=1;i<b.length;i++) sum+=b[i]-b[i-1];
  return sum/(b.length-1);
}

function addImages(fileList){
  [...fileList].forEach(f=>{
    try{
      if(!f || !/^image\//i.test(f.type)) return;
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload=()=>{ renderFrame(getCurTime()); };
      img.onerror=()=>{ console.error('Không đọc được ảnh:', f.name); URL.revokeObjectURL(url); };
      img.src=url;
    const interval = state.audio.beats.length>1 ? avgBeatInterval()*2 : state.batchConfig.duration;
    state.images.push({
      id:'im'+Math.random().toString(36).slice(2),
      src:url,
      img,
      fileBlob: f,
      fileName: f.name || `image_${Date.now()}.png`,
      duration:+interval.toFixed(2)||state.batchConfig.duration,
      effect:state.batchConfig.effect,
      transitionDur:state.batchConfig.transitionDur,
      offX:0.5,
      offY:0.5,
        zoom:1
      });
    }catch(err){
      console.error('addImages:', err);
    }
  });
  buildTimeline();
  renderPanel();
}

function parseSRT(text) {
  const lines = [];
  const regex = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\r?\n\r?\n|\r?\n*$)/g;
  let match;
  while ((match = regex.exec(text)) !== null) {
    lines.push({
      start: timeToSeconds(match[2]),
      end: timeToSeconds(match[3]),
      text: match[4].replace(/\r?\n/g, ' ').trim()
    });
  }
  return lines;
}

function timeToSeconds(t) {
  const parts = t.replace(',', '.').split(':');
  return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
}

function lyricWords(text){
  return String(text||'').trim().split(/\s+/).filter(Boolean);
}
function lyricWordWeight(word){
  const m=String(word||'').toLocaleLowerCase('vi').replace(/[^a-zà-ỹđăâêôơưịìíỉĩòóỏõọùúủũụỳýỷỹỵ]+/gi,'');
  const syl=(m.match(/[aeiouyàáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵ]/gi)||[]).length;
  return Math.max(1,(syl||1)*0.72 + Math.min(3,Math.max(0,m.length-2))*0.08);
}
function buildWordTimingsForLines(){
  const L=state.lyrics;
  L.wordTimings=[];
  (L.lines||[]).forEach((ln,li)=>{
    const words=lyricWords(ln.text); if(!words.length)return;
    const totalW=words.reduce((a,w)=>a+lyricWordWeight(w),0);
    let tt=ln.start;
    const arr=words.map((w,wi)=>{
      const next=tt+(ln.end-ln.start)*(lyricWordWeight(w)/totalW);
      const o={lineIndex:li,index:wi,word:w,start:tt,end:next}; tt=next; return o;
    });
    L.wordTimings[li]=arr;
    ln.words=arr.map(x=>({word:x.word,start:x.start,end:x.end}));
  });
}
function mergeVocalRegions(regions, maxGap=.32){
  if(!regions.length)return [];
  const out=[{start:regions[0].start,end:regions[0].end}];
  for(let i=1;i<regions.length;i++){
    const r=regions[i],last=out[out.length-1];
    if(r.start-last.end<=maxGap) last.end=Math.max(last.end,r.end); else out.push({start:r.start,end:r.end});
  }
  return out.filter(r=>r.end-r.start>=.45);
}
function activeTimeToReal(segs, x){
  let remain=Math.max(0,x);
  for(const s of segs){ const d=s.end-s.start; if(remain<=d)return s.start+remain; remain-=d; }
  return segs.length?segs[segs.length-1].end:0;
}
function allocateAcrossVocalRegions(lines, regions){
  const L=state.lyrics;
  const totalActive=regions.reduce((a,r)=>a+r.end-r.start,0);
  if(!totalActive)return distributeLyricsFallback(lines);
  const weights=lines.map(t=>Math.max(1,String(t).length*.72+lyricWords(t).reduce((a,w)=>a+lyricWordWeight(w)*1.4,0)));
  const sumW=weights.reduce((a,b)=>a+b,0);
  let activeCursor=0;
  L.lines=lines.map((text,i)=>{
    const span=totalActive*(weights[i]/sumW);
    const start=activeTimeToReal(regions,activeCursor);
    const end=activeTimeToReal(regions,Math.min(totalActive,activeCursor+span));
    activeCursor+=span;
    return {text,start:Math.max(0,start),end:Math.max(start+.12,end)};
  });
  // Snap only boundaries, never move the first lyric into intro.
  const beats=state.audio.beats||[];
  for(let i=0;i<L.lines.length;i++){
    const ln=L.lines[i];
    const search=[ln.start,ln.end];
    const snap=(target,prev)=>{
      let best=target,bestD=.12;
      for(const b of beats){ const d=Math.abs(b-target); if(d<bestD && b>=prev-0.05){best=b;bestD=d;} }
      return best;
    };
    ln.start=i===0?ln.start:snap(search[0],L.lines[i-1].end-.06);
    if(i<L.lines.length-1) ln.end=Math.max(ln.start+.18,snap(search[1],ln.start+.12));
  }
  if(L.lines.length)L.lines[L.lines.length-1].end=Math.min(state.audio.duration||L.lines.at(-1).end,L.lines.at(-1).end);
  L.enabled=true;
  buildWordTimingsForLines();
  renderPanel(); renderFrame(getCurTime());
}
async function analyzeLyricsFromAudio(lines){
  const L=state.lyrics, buf=state.audio.buffer;
  if(!buf)throw new Error('No audio');
  const sr=buf.sampleRate, frame=Math.max(512,Math.floor(sr*.025)), hop=Math.max(256,Math.floor(sr*.0125));
  const ch=buf.numberOfChannels, src=[];
  for(let c=0;c<ch;c++)src.push(buf.getChannelData(c));
  const n=Math.floor((buf.length-frame)/hop)+1, env=new Float32Array(n);
  // Vocal-likelihood: emphasize the human-vocal band and penalize extremely low-frequency energy.
  for(let k=0;k<n;k++){
    const off=k*hop; let eMid=0,eLow=0,eHigh=0,prev=0;
    const step=Math.max(1,Math.floor(frame/128));
    for(let j=0;j<frame;j+=step){
      let v=0; for(let c=0;c<ch;c++)v+=src[c][off+j]||0; v/=ch;
      const av=Math.abs(v); eMid+=av; eLow+=Math.abs(v-prev); prev=v; if(j%4===0)eHigh+=av;
    }
    // A compact heuristic: voice band is represented by sustained energy + modest zero-crossing activity.
    const mean=eMid/(frame/step), zcr=eLow/(frame/step);
    env[k]=mean*(0.72+Math.min(1.2,zcr*6));
  }
  // Smooth on roughly syllable/phrase scale.
  const radius=Math.max(2,Math.round(.14/(hop/sr)));
  const sm=new Float32Array(n); let sum=0,q=[];
  for(let i=0;i<n;i++){sum+=env[i];q.push(env[i]);if(q.length>radius){sum-=q.shift();}sm[i]=sum/q.length;}
  let vals=Array.from(sm).sort((a,b)=>a-b);
  const p35=vals[Math.floor(vals.length*.35)]||0,p72=vals[Math.floor(vals.length*.72)]||p35;
  const thr=p35+(p72-p35)*.30;
  const raw=[]; const minFrames=Math.max(3,Math.round(.28/(hop/sr)));
  let run=-1;
  for(let i=0;i<n;i++){
    const on=sm[i]>=thr;
    if(on&&run<0)run=i;
    if((!on||i===n-1)&&run>=0){const end=(i===n-1&&on?i+1:i);if(end-run>=minFrames)raw.push({start:run*hop/sr,end:Math.min(buf.duration,(end*hop+frame)/sr)});run=-1;}
  }
  L.vocalRegions=mergeVocalRegions(raw,.30);
  // Remove likely intro/outro islands shorter than a reasonable vocal phrase.
  if(L.vocalRegions.length>2){
    const longest=Math.max(...L.vocalRegions.map(r=>r.end-r.start));
    L.vocalRegions=L.vocalRegions.filter(r=>(r.end-r.start)>=Math.min(.55,longest*.18));
  }
  if(!L.vocalRegions.length) return distributeLyricsFallback(lines);
  allocateAcrossVocalRegions(lines,L.vocalRegions);
}
function distributeLyricsFallback(lines){
  const L=state.lyrics; const dur=getTotalDuration()||state.audio.duration||30;
  const beats=state.audio.beats||[]; const usableStart=beats.length?Math.max(0,beats.find(b=>b>.8)||0):0;
  const span=Math.max(.1,dur-usableStart); const per=span/Math.max(1,lines.length);
  L.lines=lines.map((text,i)=>({text,start:usableStart+i*per,end:usableStart+(i+1)*per}));
  L.enabled=true; buildWordTimingsForLines(); renderPanel(); renderFrame(getCurTime());
}
function distributeLyrics(){
  const lines = state.lyrics.raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){state.lyrics.lines=[];state.lyrics.wordTimings=[];return;}
  if(state.audio.buffer){ analyzeLyricsFromAudio(lines).catch(()=>distributeLyricsFallback(lines)); }
  else distributeLyricsFallback(lines);
}

}

/* ---------- BEAT FX PANEL ---------- */
function panelBeatFX(){
  const B=state.beatMotion;
  // Backward-safe defaults so old projects still open normally.
  B.enabled = B.enabled!==false;
  B.zoomEnabled = B.zoomEnabled!==false;
  B.intensity = Number.isFinite(B.intensity)?B.intensity:.42;
  B.zoom = Number.isFinite(B.zoom)?B.zoom:.035;
  B.shake = Number.isFinite(B.shake)?B.shake:1.8;
  B.rotation = Number.isFinite(B.rotation)?B.rotation:.18;
  B.decay = Number.isFinite(B.decay)?B.decay:.24;
  B.flashEnabled = B.flashEnabled!==false;
  B.flash = Number.isFinite(B.flash)?B.flash:.055;
  B.flashDuration = Number.isFinite(B.flashDuration)?B.flashDuration:.075;
  B.threshold = Number.isFinite(B.threshold)?B.threshold:.10;
  B.fullFlash = B.fullFlash!==false;
  B.fullFlashStrength = Number.isFinite(B.fullFlashStrength)?B.fullFlashStrength:.22;
  B.fullFlashDuration = Number.isFinite(B.fullFlashDuration)?B.fullFlashDuration:.08;
  B.smoothness = Number.isFinite(B.smoothness)?B.smoothness:.82;
  B.impactCurve = Number.isFinite(B.impactCurve)?B.impactCurve:1.18;
  B.jitterGuard = Number.isFinite(B.jitterGuard)?B.jitterGuard:.65;

  const w=el(`<div>
    <h3>Beat FX — Rung & Lóa theo nhạc</h3>
    <p class="hint">Beat nhẹ → rung/lóa nhẹ. Bass & transient mạnh → rung/lóa mạnh. Bộ lọc mượt giúp tránh giật và chóng mặt.</p>

    <div class="checkline">
      <input id="bmEnabled" type="checkbox" ${B.enabled?'checked':''}>
      Bật ảnh nhịp theo beat
    </div>

    <div class="field">
      <label>Cường độ theo beat / bass <span class="rangeval" id="bmIntV">${Math.round(B.intensity*100)}%</span></label>
      <input id="bmInt" type="range" min="0" max="1" step=".01" value="${B.intensity}">
    </div>

    <div class="divider"></div>

    <div class="checkline">
      <input id="bmZoomEnabled" type="checkbox" ${B.zoomEnabled?'checked':''}>
      Bật Zoom ảnh <span style="color:var(--muted);font-size:11px;">(tắt = chỉ rung)</span>
    </div>

    <div class="field">
      <label>Beat Punch / Zoom <span class="rangeval" id="bmZoomV">${(B.zoom*100).toFixed(1)}%</span></label>
      <input id="bmZoom" type="range" min="0" max=".09" step=".001" value="${B.zoom}" ${B.zoomEnabled?'':'disabled'}>
    </div>

    <div class="field">
      <label>Rung ảnh <span class="rangeval" id="bmShakeV">${B.shake.toFixed(1)}</span></label>
      <input id="bmShake" type="range" min="0" max="6" step=".1" value="${B.shake}">
    </div>

    <div class="field">
      <label>Xoay nhẹ <span class="rangeval" id="bmRotV">${B.rotation.toFixed(2)}°</span></label>
      <input id="bmRot" type="range" min="0" max=".8" step=".01" value="${B.rotation}">
    </div>

    <div class="field">
      <label>Độ mềm / hồi <span class="rangeval" id="bmDecayV">${B.decay.toFixed(2)}s</span></label>
      <input id="bmDecay" type="range" min=".08" max=".55" step=".01" value="${B.decay}">
    </div>

    <div class="field">
      <label>Độ mượt khi rung <span class="rangeval" id="smoothV">${Math.round(B.smoothness*100)}%</span></label>
      <input id="smoothness" type="range" min=".20" max="1" step=".01" value="${B.smoothness}">
    </div>

    <div class="field">
      <label>Độ tương phản beat mạnh / nhẹ <span class="rangeval" id="impactV">${B.impactCurve.toFixed(2)}x</span></label>
      <input id="impactCurve" type="range" min=".70" max="1.70" step=".01" value="${B.impactCurve}">
    </div>

    <div class="field">
      <label>Chống rung lặt vặt <span class="rangeval" id="guardV">${Math.round(B.jitterGuard*100)}%</span></label>
      <input id="jitterGuard" type="range" min=".10" max=".95" step=".01" value="${B.jitterGuard}">
    </div>

    <div class="divider"></div>

    <div class="checkline">
      <input id="bfEnabled" type="checkbox" ${B.flashEnabled?'checked':''}>
      Lóa sáng mềm theo beat
    </div>

    <div class="field">
      <label>Độ lóa cục bộ <span class="rangeval" id="bfV">${Math.round(B.flash*100)}%</span></label>
      <input id="bf" type="range" min="0" max=".18" step=".005" value="${B.flash}">
    </div>

    <div class="field">
      <label>Thời gian lóa cục bộ <span class="rangeval" id="bfDurV">${Math.round(B.flashDuration*1000)}ms</span></label>
      <input id="bfDur" type="range" min=".025" max=".16" step=".005" value="${B.flashDuration}">
    </div>

    <div class="field">
      <label>Ngưỡng beat để nháy <span class="rangeval" id="bfThrV">${Math.round(B.threshold*100)}%</span></label>
      <input id="bfThr" type="range" min="0" max=".8" step=".01" value="${B.threshold}">
    </div>

    <div class="divider"></div>

    <div class="checkline">
      <input id="ffEnabled" type="checkbox" ${B.fullFlash?'checked':''}>
      Lóa sáng toàn hình thật
    </div>

    <div class="field">
      <label>Độ mạnh lóa toàn hình <span class="rangeval" id="ffStrengthV">${Math.round(B.fullFlashStrength*100)}%</span></label>
      <input id="ffStrength" type="range" min="0" max=".8" step=".01" value="${B.fullFlashStrength}">
    </div>

    <div class="field">
      <label>Thời gian nháy toàn hình <span class="rangeval" id="ffDurV">${Math.round(B.fullFlashDuration*1000)}ms</span></label>
      <input id="ffDur" type="range" min=".02" max=".30" step=".005" value="${B.fullFlashDuration}">
    </div>

    <button class="btn-primary-sm" id="shakeOnlyPreset" style="width:100%">RUNG THÔI — Tắt Zoom</button>
    <button class="btn-primary-sm" id="softPreset" style="width:100%;margin-top:6px">PRESET MƯỢT — khuyên dùng</button>
    <button class="btn-sm" id="resetPreset" style="width:100%;margin-top:6px">RESET BEAT FX</button>
  </div>`);

/* =========================================================================
   AUDIO SETUP
========================================================================= */
function setupAudioGraph(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioEl = document.getElementById('audioEl');
    sourceNode = audioCtx.createMediaElementSource(audioEl);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.68;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    gainNode = audioCtx.createGain();

    sourceNode.connect(analyser);
    analyser.connect(gainNode);
    gainNode.connect(audioCtx.destination);
  }
}

async function loadAudio(file){
  if(!file) return;
  try{
    setupAudioGraph();
    const audioEl = document.getElementById('audioEl');
  audioEl.pause();
  state.playing = false;
  document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  if(state.audio.url) URL.revokeObjectURL(state.audio.url);

  state.audio.file = file;
  state.audio.fileName = file.name || `audio_${Date.now()}.mp3`;
  const url = URL.createObjectURL(file);
  state.audio.url = url;
  audioEl.src = url;
  audioEl.load();

  const arrBuf = await file.arrayBuffer();
  const buf = await audioCtx.decodeAudioData(arrBuf.slice(0));
  state.audio.buffer = buf;
  state.audio.duration = buf.duration;
  
  computePeaks(buf);
  doBeatAnalysis(1.4);
  buildTimeline();
    renderPanel();
    drawTimelineCanvas();
    renderFrame(0);
  }catch(err){
    console.error('loadAudio:', err);
    alert('Không load được file nhạc: ' + (err && err.message ? err.message : err));
  }
}

function computePeaks(buf){
  const data = buf.getChannelData(0);
  const N=1000;
  const step = Math.floor(data.length/N)||1;
  const peaks=[];
  for(let i=0;i<N;i++){
    let max=0;
    for(let j=i*step;j<Math.min((i+1)*step,data.length);j++){ const v=Math.abs(data[j]); if(v>max) max=v; }
    peaks.push(max);
  }
  state.audio.peaks=peaks;
}

function doBeatAnalysis(sensitivity){
  beatAnalysisSensitivity=parseFloat(sensitivity)||1.4;
  const buf=state.audio.buffer; if(!buf) return;
  const data=buf.getChannelData(0), sr=buf.sampleRate;
  const frame=Math.max(256,Math.floor(sr*0.02));
  const hop=Math.max(128,Math.floor(sr*0.01));
  const n=Math.max(1,Math.floor((data.length-frame)/hop)+1);
  const energy=new Float32Array(n), low=new Float32Array(n);

  let lp=0;
  for(let i=0;i<n;i++){
    const st=i*hop,en=Math.min(data.length,st+frame);
    let e=0,l=0;
    for(let j=st;j<en;j++){
      const v=data[j];
      e+=v*v;
      lp += 0.012*(v-lp);
      l+=lp*lp;
    }
    energy[i]=Math.sqrt(e/Math.max(1,en-st));
    low[i]=Math.sqrt(l/Math.max(1,en-st));
  }

  const percentile=(arr,p)=>{
    const a=Array.from(arr).sort((x,y)=>x-y);
    return a[Math.floor((a.length-1)*p)]||1e-9;
  };
  const e90=percentile(energy,.9)+1e-9, l90=percentile(low,.9)+1e-9;
  const onset=new Float32Array(n), bass=new Float32Array(n);
  for(let i=1;i<n;i++){
    onset[i]=Math.max(0,energy[i]-energy[i-1])/e90;
    bass[i]=low[i]/l90;
  }

  const beats=[], strengths=[];
  const refractory=0.085;
  let last=-999;
  const sens=Math.max(1.0,Number(sensitivity)||1.4);

  for(let i=2;i<n-2;i++){
    const t=i*hop/sr;
    const a0=Math.max(0,i-20),a1=Math.min(n,i+21);
    let avg=0;
    for(let k=a0;k<a1;k++)avg+=onset[k];
    avg/=Math.max(1,a1-a0);

    const isPeak=onset[i]>=onset[i-1] && onset[i]>=onset[i+1];
    const threshold=Math.max(.08,avg*sens*.72);
    const mixed=.68*onset[i]+.32*Math.min(1.5,bass[i]);
    if(isPeak && onset[i]>threshold && mixed>.16){
      const strength=Math.max(.06,Math.min(1,
        .28 + .58*Math.min(1.15,onset[i]) + .34*Math.min(1.2,bass[i])
      ));
      if(t-last>=refractory){
        beats.push(t); strengths.push(strength); last=t;
      }else if(strength>(strengths[strengths.length-1]||0)){
        beats[beats.length-1]=t; strengths[strengths.length-1]=strength; last=t;
      }
    }
  }

  let bpm=120;
  if(beats.length>5){
    const ints=[];
    for(let i=1;i<beats.length;i++){
      const d=beats[i]-beats[i-1];
      if(d>.28 && d<1.5)ints.push(d);
    }
    if(ints.length){
      ints.sort((a,b)=>a-b);
      let med=ints[(ints.length/2)|0];
      bpm=60/med;
      while(bpm<80)bpm*=2;
      while(bpm>170)bpm/=2;
      bpm=Math.round(bpm);
    }
  }
  state.audio.beats=beats;
  state.audio.beatStrengths=strengths;
  state.audio.bpm=bpm;
  renderPanel(); drawTimelineCanvas(); renderFrame(getCurTime());
}

/* =========================================================================
   TIMELINE SCHEDULING
========================================================================= */
let sequence=[];
function buildTimeline(){
  sequence=[];
  const total = state.audio.duration || getTotalDuration() || 0;
  if(state.images.length===0 || total<=0) return;
  let t=0, i=0;
  while(t<total){
    const im = state.images[i % state.images.length];
    let segDur = im.duration;
    if(t+segDur>total) segDur = total-t;
    sequence.push({image:im, start:t, end:t+segDur, index:i});
    t += segDur;
    i++;
    if(i>5000) break;
  }
}
function getTotalDuration(){
  if(state.audio.duration) return state.audio.duration;
  return state.images.reduce((a,b)=>a+b.duration,0);
}

/* =========================================================================
   RENDER ENGINE
========================================================================= */
function easeOutCubic(x){ return 1-Math.pow(1-x,3); }
function easeInOutQuad(x){ return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerp(a,b,t){ return a+(b-a)*t; }

function getImageEffectTransform(effectId, p, absT, imgSeg){
  let scale=1, tx=0, ty=0, rotate=0, opacity=1;
  let blackOverlay=0, blurPx=0, mirrorX=1, flashAlpha=0, glitchAmt=0;
  let lightLeaks=0, irisRadius=null;

  const segDuration = Math.max(0.001, imgSeg.end - imgSeg.start);
  const transTime = Math.min(segDuration * 0.45, imgSeg.image.transitionDur || 0.5);
  const transDur = transTime / segDuration;

  switch(effectId){
    case 'none': {
      scale=1; tx=0; ty=0; rotate=0; opacity=1;
      blackOverlay=0; blurPx=0; mirrorX=1; flashAlpha=0; glitchAmt=0; lightLeaks=0; irisRadius=null;
      break;
    }
    case 'fadeblack': {
      scale = 1 + 0.08 * p;
      if(p < transDur){
        blackOverlay = 1 - easeInOutQuad(p / transDur);
      } else if(p > (1 - transDur)){
        blackOverlay = easeInOutQuad((p - (1 - transDur)) / transDur);
      }
      break;
    }
    case 'blurfocus': {
      scale = 1 + 0.06 * p;
      if(p < transDur){
        blurPx = (1 - easeOutCubic(p / transDur)) * 14;
      } else if(p > (1 - transDur)){
        blurPx = easeOutCubic((p - (1 - transDur)) / transDur) * 14;
      }
      break;
    }
    case 'mirror': {
      scale = 1.08;
      if(p < transDur){
        mirrorX = Math.cos((p / transDur) * Math.PI / 2);
      } else if(p > (1 - transDur)){
        mirrorX = Math.cos(((p - (1 - transDur)) / transDur) * Math.PI / 2);
      }
      break;
    }
    case 'flash': {
      scale = 1 + 0.09 * p;
      if(p < transDur){
        flashAlpha = Math.pow(1 - (p / transDur), 2);
      } else if(p > (1 - transDur)){
        flashAlpha = Math.pow((p - (1 - transDur)) / transDur, 2);
      }
      break;
    }
    case 'whippan': {
      scale = 1.12;
      if(p < transDur){
        const norm = p / transDur;
        tx = lerp(0.3, 0, easeOutCubic(norm));
        blurPx = (1 - norm) * 10;
      } else if(p > (1 - transDur)){
        const norm = (p - (1 - transDur)) / transDur;
        tx = lerp(0, -0.3, easeOutCubic(norm));
        blurPx = norm * 10;
      }
      break;
    }
    case 'glitch': {
      scale = 1 + 0.07 * p;
      if(p < transDur || p > (1 - transDur)){
        glitchAmt = (p < transDur) ? (1 - (p/transDur)) : ((p - (1 - transDur))/transDur);
      }
      break;
    }
    case 'vortex': {
      if(p < transDur){
        const norm = p / transDur;
        rotate = lerp(-40, 0, easeOutCubic(norm));
        scale = lerp(1.4, 1, easeOutCubic(norm));
        opacity = norm;
      } else if(p > (1 - transDur)){
        const norm = (p - (1 - transDur)) / transDur;
        rotate = lerp(0, 40, easeOutCubic(norm));
        scale = lerp(1, 1.4, easeOutCubic(norm));
        opacity = 1 - norm;
      }
      break;
    }
    case 'zoompunch': {
      if(p < transDur){
        scale = lerp(0.65, 1, easeOutCubic(p / transDur));
        opacity = p / transDur;
      } else if(p > (1 - transDur)){
        const norm = (p - (1 - transDur)) / transDur;
        scale = lerp(1, 1.6, easeOutCubic(norm));
        opacity = 1 - norm;
      }
      break;
    }
    case 'lightleaks': {
      scale = 1 + 0.08 * p;
      if(p < transDur){
        lightLeaks = 1 - (p / transDur);
      } else if(p > (1 - transDur)){
        lightLeaks = (p - (1 - transDur)) / transDur;
      }
      break;
    }
    case 'iris': {
      scale = 1 + 0.06 * p;
      if(p < transDur){
        irisRadius = easeOutCubic(p / transDur);
      } else if(p > (1 - transDur)){
        irisRadius = 1 - easeOutCubic((p - (1 - transDur)) / transDur);
      }
      break;
    }
  }

  return {scale, tx, ty, rotate, opacity, blackOverlay, blurPx, mirrorX, flashAlpha, glitchAmt, lightLeaks, irisRadius};
}

/* =========================================================================
   RENDER SPEED - cache anh da co san (OPT 2026-11-09, sua 2026-11-09)
   Truoc day moi khung ve truc tiep tu anh goc (co the ~24MP) thu nho ve co
   xuat. Cache 3 anh gan nhat da co ve ~1.7x co xuat (du cho effect scale toi
   da 1.6x * beat zoom ~1.035), cac khung ve tu anh da co thay vi anh goc.
   Hinh khong doi: cung ti le anh, cung drawW/drawH/px/py nhu cu.
   HAI DIEU KIEN BAO VE (rut ra tu viec ban dau lam cham clip nhieu anh):
   - Chi dung cache cho doan anh >= 4 giay. Doan ngan doi anh lien tuc thi
     chi phi build cache 1 lan lon hon tien loi ve nhanh moi khung.
   - Build cache bang smoothing 'low' (duong di nhanh): anh da co van lon
     gap 1.7x co xuat nen chat luong van nhu cu, chi mat tien build re hon.
   ========================================================================= */
const _coverCache = new Map();
function getCoverImage(im, w, h){
  if(!im || !im.img || !im.img.complete || !im.img.naturalWidth) return null;
  const iw=im.img.naturalWidth, ih=im.img.naturalHeight;
  const canvasRatio=w/h, imgRatio=iw/ih;
  let tw, th;
  if(imgRatio>canvasRatio){ th=Math.ceil(h*1.7); tw=Math.ceil(th*imgRatio); }
  else { tw=Math.ceil(w*1.7); th=Math.ceil(tw/imgRatio); }
  if(tw>iw) tw=iw; if(th>ih) th=ih;
  tw=Math.max(2,tw); th=Math.max(2,th);
  const ent=_coverCache.get(im);
  if(ent && ent.w===tw && ent.h===th) return ent.cv;
  const cv=document.createElement('canvas'); cv.width=tw; cv.height=th;
  const cc=cv.getContext('2d');
  cc.imageSmoothingEnabled=true; cc.imageSmoothingQuality='low';
  cc.drawImage(im.img,0,0,tw,th);
  if(_coverCache.size>=3){ const k=_coverCache.keys().next().value; _coverCache.delete(k); }
  _coverCache.set(im,{w:tw,h:th,cv:cv});
  return cv;
}

function drawImageCover(c, im, offX, offY, extraScale, tx, ty, rotateDeg, opacity, w, h, fx, useCache){
  if(!im.img || !im.img.complete || im.img.naturalWidth===0) return;
  c.save();
  c.globalAlpha = Math.max(0, Math.min(1, opacity));

  if(fx && fx.blurPx > 0.5){
    c.filter = `blur(${fx.blurPx}px)`;
  }

  if(fx && fx.irisRadius !== null){
    const maxR = Math.hypot(w/2, h/2);
    c.beginPath();
    c.arc(w/2, h/2, maxR * Math.max(0.01, fx.irisRadius), 0, Math.PI * 2);
    c.clip();
  }

  c.translate(w/2, h/2);
  c.rotate(rotateDeg * Math.PI / 180);
  if(fx && fx.mirrorX !== 1){
    c.scale(fx.mirrorX, 1);
  }
  c.translate(tx * w, ty * h);

  const iw=im.img.naturalWidth, ih=im.img.naturalHeight;
  const srcImg = (useCache===false) ? im.img : (getCoverImage(im, w, h) || im.img);
  const canvasRatio=w/h, imgRatio=iw/ih;
  let drawW,drawH;
  if(imgRatio>canvasRatio){ drawH=h*extraScale; drawW=drawH*imgRatio; } else { drawW=w*extraScale; drawH=drawW/imgRatio; }
  const maxOffX=(drawW-w)/2, maxOffY=(drawH-h)/2;
  const px = -(drawW/2) - ((offX-0.5)*2*maxOffX);
  const py = -(drawH/2) - ((offY-0.5)*2*maxOffY);

  if(fx && fx.glitchAmt > 0){
    const shift = fx.glitchAmt * 24 * (w/1080);
    c.drawImage(srcImg, px - shift, py, drawW, drawH);
    c.globalCompositeOperation = 'screen';
    c.drawImage(srcImg, px + shift, py, drawW, drawH);
  } else {
    c.drawImage(srcImg, px, py, drawW, drawH);
  }

  c.restore();

  if(fx && fx.blackOverlay > 0){
    c.save();
    c.fillStyle = `rgba(0,0,0,${Math.min(1, Math.max(0, fx.blackOverlay))})`;
    c.fillRect(0,0,w,h);
    c.restore();
  }

  if(fx && fx.flashAlpha > 0){
    c.save();
    c.fillStyle = `rgba(255,255,255,${Math.min(1, Math.max(0, fx.flashAlpha))})`;
    c.fillRect(0,0,w,h);
    c.restore();
  }

  if(fx && fx.lightLeaks > 0){
    c.save();
    c.globalCompositeOperation = 'screen';
    const grad = c.createRadialGradient(w*0.8, h*0.2, 0, w*0.8, h*0.2, Math.max(w,h)*0.85);
    grad.addColorStop(0, `rgba(255, 140, 0, ${fx.lightLeaks * 0.85})`);
    grad.addColorStop(0.5, `rgba(255, 0, 110, ${fx.lightLeaks * 0.5})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = grad;
    c.fillRect(0,0,w,h);
    c.restore();
  }
}

/* =========================================================================
   AVEE WAVEFORM RENDERER
========================================================================= */
// Short MP4 xuat tu file nhac rieng: song phai theo dung file Short, khong
// theo nhac chinh cua tool. Dat directWaveBufferOverride truoc vong render
// Short va xoa o finally cua exportShortCutMp4.
let directWaveBufferOverride=null;
const directWaveOverrideCache={};
function ensureDirectWaveCache(){
  const audio=state.audio;
  const buf=directWaveBufferOverride || (audio && audio.buffer);
  if(!buf) return null;
  // Khop voi analyser xem truoc: fftSize 1024, thang dB -100..-30 (mac dinh
  // cua AnalyserNode), de cung mot bin luon ung voi cung tan so o ca 2 noi.
  const fftSize=1024;
  const sr=buf.sampleRate||44100;
  const cacheKey = `${buf.sampleRate}|${buf.length}|spectrum-${fftSize}-60hz-smooth68`;
  // Cache cua Short giu rieng theo dung doi tuong buffer (so sanh identity)
  // de khong trung key voi nhac chinh.
  if(directWaveBufferOverride){
    if(directWaveOverrideCache.buf===buf && directWaveOverrideCache.cache) return directWaveOverrideCache.cache;
  }else if(audio.renderWaveCache && audio.renderWaveCache.key===cacheKey) return audio.renderWaveCache;

  const data=buf.getChannelData(0);
  const half=fftSize/2;
  // Lay mau 60Hz nhu analyser xem truoc (goi getByteFrequencyData moi frame
  // ~60fps): cua so chong len nhau (hop ~735 < fftSize 1024) nen pho bien
  // thien lien tuc. Mau 24Hz cu co hop ~1837 > 1024, cua so roi nhau nen
  // moi frame la mot anh chup doc lap -> song nhay loan xa.
  const hop=Math.max(128,Math.floor(sr/60)); // cache at 60 Hz; render interpolates to exact video timestamps
  const frameCount=Math.max(1,Math.ceil(data.length/hop));
  // Chi luu 256 bin dau: wave chi doc toi bin 255 (waveRenderRawData 256).
  const storeBins=Math.min(half,256);
  const spectra=new Float32Array(frameCount*storeBins);
  const re=new Float32Array(fftSize);
  const im=new Float32Array(fftSize);
  const hann=new Float32Array(fftSize);
  // Lam muot theo thoi gian giong smoothingTimeConstant=0.68 cua AnalyserNode
  // xem truoc: moi frame chi di 32% ve gia tri moi, con lai giu gia tri cu.
  const smoothPrev=new Float32Array(storeBins);

  for(let n=0;n<fftSize;n++) hann[n]=0.5-0.5*Math.cos((2*Math.PI*n)/(fftSize-1));

  // Iterative radix-2 FFT. Built once per audio file so export frames only
  // interpolate cached frequency spectra; no repeated PCM sweep per frame.
  for(let frame=0;frame<frameCount;frame++){
    const center=frame*hop;
    const start=center-(fftSize>>1);
    for(let i=0;i<fftSize;i++){
      const idx=start+i;
      re[i]=(idx>=0 && idx<data.length ? data[idx] : 0)*hann[i];
      im[i]=0;
    }

    for(let i=1,j=0;i<fftSize;i++){
      let bit=fftSize>>1;
      for(; j&bit; bit>>=1) j^=bit;
      j^=bit;
      if(i<j){
        let tmp=re[i]; re[i]=re[j]; re[j]=tmp;
        tmp=im[i]; im[i]=im[j]; im[j]=tmp;
      }
    }
    for(let len=2;len<=fftSize;len<<=1){
      const ang=-2*Math.PI/len, wlenR=Math.cos(ang), wlenI=Math.sin(ang);
      for(let i=0;i<fftSize;i+=len){
        let wr=1, wi=0, halfLen=len>>1;
        for(let j=0;j<halfLen;j++){
          const uR=re[i+j], uI=im[i+j];
          const vR=re[i+j+halfLen]*wr - im[i+j+halfLen]*wi;
          const vI=re[i+j+halfLen]*wi + im[i+j+halfLen]*wr;
          re[i+j]=uR+vR; im[i+j]=uI+vI;
          re[i+j+halfLen]=uR-vR; im[i+j+halfLen]=uI-vI;
          const nextWr=wr*wlenR-wi*wlenI;
          wi=wr*wlenI+wi*wlenR; wr=nextWr;
        }
      }
    }

    const outBase=frame*storeBins;
    for(let k=0;k<storeBins;k++){
      const mag=Math.sqrt(re[k]*re[k]+im[k]*im[k])/(fftSize*0.5);
      const db=20*Math.log10(mag+1e-9);
      // Khong gamma phu: thang dB -100..-30 giong het analyser, khong nang
      // nen nhieu o vung yen nhu pow(norm,0.72) cu.
      const norm=Math.max(0,Math.min(1,(db+100)/70));
      smoothPrev[k]=0.68*smoothPrev[k]+0.32*norm;
      spectra[outBase+k]=smoothPrev[k];
    }
  }

  const cache={key:cacheKey,sr,hop,fftSize,half:storeBins,spectra,frameCount};
  if(directWaveBufferOverride){ directWaveOverrideCache.buf=buf; directWaveOverrideCache.cache=cache; }
  else audio.renderWaveCache=cache;
  return cache;
}

function mapBalladFrequencyBin(norm, mapMode){
  const n=Math.max(0,Math.min(1,norm));
  const mode=mapMode||'left_bass_right_treble';

  // Map the visual position to perceptual frequency bands instead of using a
  // plain linear FFT-bin spread. This keeps the low-frequency/bass response
  // concentrated where the selected direction asks for it, while still
  // allowing the higher frequencies to taper naturally across the remaining
  // bars.
  // Phu het dai analyser (bin 2..255, toi ~11kHz) thay vi cat o bin 127
  // (5.5kHz): hat/cymbal o dai cao gio cung phan hoi tren song.
  const maxBin=255, minBin=2, range=maxBin-minBin;
  const perceptual=(x)=>Math.pow(Math.max(0,Math.min(1,x)),1.65);

  if(mode==='center_bass_sides_treble'){
    const d=Math.abs(n*2-1);
    return Math.round(minBin + perceptual(d)*range);
  }

  if(mode==='right_bass_left_treble'){
    return Math.round(minBin + perceptual(1-n)*range);
  }

  if(mode==='uniform'){
    return Math.round(minBin + n*range);
  }

  // Default: bass is strongest on the left, then progressively moves toward
  // the mid/high range on the right.
  return Math.round(minBin + perceptual(n)*range);
}

let waveRenderRawData = new Uint8Array(256);
let directRenderOverlayEl = null;
function getDirectRenderWaveFlag(){
  if(!directRenderOverlayEl) directRenderOverlayEl = document.getElementById('directRenderOverlay');
  return directRenderOverlayEl ? directRenderOverlayEl.style.display === 'flex' : false;
}

// Hue cua 96 cham dinh song dense_bars: hang so theo chi so cot, tinh san 1 lan.
const _denseHueFill=[], _denseHueShadow=[];
for(let _dh=0;_dh<96;_dh++){ _denseHueFill.push(`hsl(${(_dh/96)*320}, 100%, 70%)`); _denseHueShadow.push(`hsl(${(_dh/96)*320}, 100%, 65%)`); }

function drawAveeWaveSingle(c, w, h, t){
  const Wv = state.wave;
  if(!Wv.enabled) return;

  // Reuse the same FFT sample buffer on every frame to avoid per-frame typed-array allocation.
  // Direct render only needs bins through ~160 in the current wave styles.
  const rawData = waveRenderRawData;
  const directRenderWave = getDirectRenderWaveFlag();

  if(directRenderWave && state.audio && state.audio.buffer){
    // DIRECT EXPORT: use a cached envelope from the decoded PCM.
    // The cache is built once; each frame only performs lightweight interpolation,
    // keeping the render loop responsive so Beat Motion stays as smooth as MASTER.
    const cache=ensureDirectWaveCache();
    if(cache){
      const sr=cache.sr, hop=cache.hop, half=cache.half, spectra=cache.spectra;
      const framePos=Math.max(0,Math.min(cache.frameCount-1,(t*sr)/hop));
      const f0=Math.floor(framePos), f1=Math.min(cache.frameCount-1,f0+1), ft=framePos-f0;
      const base0=f0*half, base1=f1*half;
      const limit=Math.min(rawData.length, half);
      for(let i=0;i<limit;i++){
        const amp=spectra[base0+i]*(1-ft)+spectra[base1+i]*ft;
        rawData[i]=amp<=0 ? 0 : amp>=1 ? 255 : (amp*255+0.5)|0;
      }
      for(let i=limit;i<rawData.length;i++) rawData[i]=0;
    }else{
      rawData.fill(0);
    }
  } else if(analyser){
    // LIVE PREVIEW: preserve the original real-time FFT analyser path.
    analyser.getByteFrequencyData(rawData);
  } else {
    rawData.fill(0);
  }

  const isVertical = state.aspect === '916';
  const scaleRef = isVertical ? (w / 1080) : (w / 1920);

  const widthMultiplier = (Wv.widthScale || 75) / 100;
  const totalWidth = (isVertical ? w * 0.95 : w * 0.85) * widthMultiplier;
  const centerX = (w * (Wv.x / 100));
  const startX = centerX - totalWidth / 2;
  const endX = startX + totalWidth;

  const baselineY = h * (Wv.y / 100);
  const sensitivity = Wv.heightScale || 1.4;
  const maxBarHeight = (isVertical ? 80 : 65) * (h / 1080) * sensitivity;
  const waveStyle = Wv.style || 'dense_bars';
  beginWaveSmoothFrame(t, waveStyle);
  const peakDt=wavePeakDt();

  lightSweepPhase += 0.02;

  c.save();

  if (waveStyle === 'dense_bars') {
    const barCount = 96;
    const barWidth = Math.max(1.5 * scaleRef, (totalWidth / barCount) * 0.65);
    const barSpacing = (totalWidth - (barCount * barWidth)) / (barCount - 1);

    for (let i = 0; i < barCount; i++) {
      const normPos = i / barCount;
      // Duong cong tri giac ^1.65 (giong mapBalladFrequencyBin): moi cot doc mot
      // dai tan so rieng, trai = bass, phai = treble, phu het bin 1..255
      // (0-11kHz). Cong thuc 3 doan cu co khoang trong (bin 6-9, 47-59 khong
      // ai doc) va cat o bin 106 (4.6kHz) nen hat/cymbal tren 4.6kHz khong
      // bao gio hien tren song, va 24 cot bass chi doc 4 bin.
      let binIndex = Math.max(1, Math.min(255, Math.round(1 + 254 * Math.pow(normPos, 1.65))));
      const rawVal = (rawData[binIndex] || 0) / 255;
      const dynamicVal = Math.pow(rawVal, 1.6) * 1.35;
      const currentHeight = waveSmoothHeight(i, Math.max(2.0 * scaleRef, dynamicVal * maxBarHeight));
      const barX = startX + i * (barWidth + barSpacing);

      c.fillStyle = Wv.color || '#ffffff';
      c.shadowBlur = 0;
      c.beginPath();
      if(c.roundRect) c.roundRect(barX, baselineY - currentHeight, barWidth, currentHeight, 1.0 * scaleRef);
      else c.rect(barX, baselineY - currentHeight, barWidth, currentHeight);
      c.fill();

      if (currentHeight >= peakHeights[i]) {
        peakHeights[i] = currentHeight;
        peakSpeeds[i] = 0;
      } else {
        wavePeakFall(i, 0.07 * (h / 1080), 2.0 * scaleRef, peakDt);
      }

      c.fillStyle = _denseHueFill[i];
      c.shadowColor = _denseHueShadow[i];
      c.shadowBlur = 5 * scaleRef;
      c.beginPath();
      c.arc(barX + barWidth / 2, baselineY - peakHeights[i] - (3.5 * scaleRef), 1.4 * scaleRef, 0, Math.PI * 2);
      c.fill();
    }

  } else if (waveStyle === 'ballad_soft_bars') {
    // Ballad: thin organic stems, low visual density, soft pastel glow.
    const barCount = 72;
    const gap = totalWidth / Math.max(1, barCount - 1);
    for(let i=0;i<barCount;i++){
      const norm=i/(barCount-1);
      const bin=Math.min(120, Math.floor(2 + norm*118));
      const v=Math.pow((rawData[bin]||0)/255,1.65);
      const currentHeight=waveSmoothHeight(i, Math.max(1.5*scaleRef, v*maxBarHeight*0.82));
      const x=startX+i*gap;
      const width=Math.max(1.1*scaleRef,1.9*scaleRef-(0.65*scaleRef));
      c.fillStyle=Wv.color||'#b7f0de';
      c.shadowColor=Wv.color2||'#ffffff';
      c.shadowBlur=3.2*scaleRef;
      if(c.roundRect){c.beginPath();c.roundRect(x-width/2,baselineY-currentHeight,width,currentHeight,1.2*scaleRef);c.fill();}
      else{c.fillRect(x-width/2,baselineY-currentHeight,width,currentHeight);}
      c.shadowBlur=0;
      if(currentHeight>=peakHeights[i]){ peakHeights[i]=currentHeight; peakSpeeds[i]=0; }
      else { wavePeakFall(i, (Number(Wv.peakSpeed??Wv.fallSpeed??0.07))*scaleRef, 2*scaleRef, peakDt); }
      c.fillStyle=Wv.color2||'#ffffff'; c.shadowColor=Wv.color2||'#ffffff'; c.shadowBlur=5*scaleRef;
      c.beginPath(); c.arc(x,baselineY-peakHeights[i]-2.4*scaleRef,Math.max(1.2*scaleRef,1.7*scaleRef),0,Math.PI*2); c.fill(); c.shadowBlur=0;
    }

  } else if (waveStyle === 'ballad_glow_stems') {
    const barCount=64, gap=totalWidth/Math.max(1,barCount-1);
    for(let i=0;i<barCount;i++){
      const norm=i/(barCount-1), bin=Math.min(255,mapBalladFrequencyBin(norm,Wv.frequencyMap));
      const v=Math.pow((rawData[bin]||0)/255,1.55);
      const hh=waveSmoothHeight(i, Math.max(2*scaleRef,v*maxBarHeight*0.92));
      const x=startX+i*gap;
      const stemW=Math.max(1.5*scaleRef,2.2*scaleRef);
      c.fillStyle=Wv.color||'#9fe7dc'; c.shadowColor=Wv.color2||'#f5fbff'; c.shadowBlur=6*scaleRef;
      c.beginPath(); c.roundRect ? c.roundRect(x-stemW/2,baselineY-hh,stemW,hh,stemW/2) : c.fillRect(x-stemW/2,baselineY-hh,stemW,hh); c.fill();
      if(hh>=peakHeights[i]){ peakHeights[i]=hh; peakSpeeds[i]=0; }
      else { wavePeakFall(i, (Number(Wv.peakSpeed??Wv.fallSpeed??0.07))*scaleRef, 2*scaleRef, peakDt); }
      const capY=baselineY-peakHeights[i]-3.2*scaleRef;
      const capR=Math.max(1.5*scaleRef,2.2*scaleRef*(0.55+v));
      c.fillStyle=Wv.color2||'#ffffff'; c.shadowColor=Wv.color2||'#ffffff'; c.shadowBlur=8*scaleRef;
      c.beginPath(); c.arc(x,capY,capR,0,Math.PI*2); c.fill();
    }

  } else if (waveStyle === 'ballad_forest') {
    const barCount=88, gap=totalWidth/Math.max(1,barCount-1);
    for(let i=0;i<barCount;i++){
      const norm=i/(barCount-1), bin=Math.min(255,mapBalladFrequencyBin(norm,Wv.frequencyMap));
      const raw=(rawData[bin]||0)/255;
