    const step = totalWidth / (pointCount - 1);
    let points = [];
    for (let i = 0; i < pointCount; i++) {
      const bin = Math.floor((i / pointCount) * 120) + 1;
      points.push({ x: startX + i * step, y: baselineY - Math.pow((rawData[bin] || 0) / 255, 1.5) * maxBarHeight * 1.25 });
    }
    c.beginPath();
    c.moveTo(startX, baselineY);
    c.lineTo(points[0].x, points[0].y);
    for (let i = 0; i < points.length - 1; i++) {
      c.quadraticCurveTo(points[i].x, points[i].y, (points[i].x + points[i + 1].x) / 2, (points[i].y + points[i + 1].y) / 2);
    }
    c.lineTo(endX, baselineY);
    c.closePath();

    const gradFill = c.createLinearGradient(0, baselineY - maxBarHeight, 0, baselineY);
    gradFill.addColorStop(0, 'rgba(56, 189, 248, 0.7)');
    gradFill.addColorStop(0.6, 'rgba(236, 72, 153, 0.35)');
    gradFill.addColorStop(1, 'rgba(0, 0, 0, 0)');
    c.fillStyle = gradFill;
    c.fill();

    c.strokeStyle = '#ffffff';
    c.lineWidth = 2.5 * scaleRef;
    c.shadowColor = Wv.color || '#38bdf8';
    c.shadowBlur = 12 * scaleRef;
    c.stroke();

  } else if (waveStyle === 'ultra_fine_bars') {
    const barCount = 128;
    const barWidth = Math.max(1.0 * scaleRef, (totalWidth / barCount) * 0.55);
    const barSpacing = (totalWidth - (barCount * barWidth)) / (barCount - 1);
    for (let i = 0; i < barCount; i++) {
      const bin = Math.floor((i / barCount) * 160) + 1;
      const hBar = Math.pow((rawData[bin] || 0) / 255, 1.6) * maxBarHeight * 1.1;
      const barX = startX + i * (barWidth + barSpacing);
      c.fillStyle = `hsl(${180 + (i / barCount) * 140}, 100%, 75%)`;
      c.shadowColor = c.fillStyle;
      c.shadowBlur = 3 * scaleRef;
      c.fillRect(barX, baselineY - hBar, barWidth, hBar);
    }

  } else if (waveStyle === 'multi_ribbon_wave') {
    const colors = [Wv.color || '#38bdf8', Wv.color2 || '#ec4899', '#a855f7'];
    for (let r = 0; r < 3; r++) {
      const pts = 50, st = totalWidth / (pts - 1);
      c.beginPath();
      for (let i = 0; i < pts; i++) {
        const bin = Math.floor((i / pts) * (80 + r * 20)) + 1;
        const yVal = baselineY - Math.pow((rawData[bin] || 0) / 255, 1.5) * maxBarHeight * (1.1 - r * 0.25);
        if (i === 0) c.moveTo(startX, yVal);
        else c.lineTo(startX + i * st, yVal);
      }
      c.strokeStyle = colors[r];
      c.lineWidth = (2.2 - r * 0.4) * scaleRef;
      c.shadowColor = colors[r];
      c.shadowBlur = 10 * scaleRef;
      c.stroke();
    }

  } else if (waveStyle === 'color_shift_bars') {
    const barCount = 72;
    const barWidth = (totalWidth / barCount) * 0.7;
    const barSpacing = (totalWidth - (barCount * barWidth)) / (barCount - 1);
    for (let i = 0; i < barCount; i++) {
      const bin = Math.floor((i / barCount) * 130) + 1;
      const hBar = Math.pow((rawData[bin] || 0) / 255, 1.5) * maxBarHeight;
      const barX = startX + i * (barWidth + barSpacing);
      const grad = c.createLinearGradient(0, baselineY - hBar, 0, baselineY);
      const hue = (i * 5 + lightSweepPhase * 50) % 360;
      grad.addColorStop(0, `hsl(${hue}, 100%, 75%)`);
      grad.addColorStop(1, `hsl(${(hue + 60) % 360}, 100%, 45%)`);
      c.fillStyle = grad;
      c.shadowColor = `hsl(${hue}, 100%, 65%)`;
      c.shadowBlur = 6 * scaleRef;
      c.beginPath();
      if(c.roundRect) c.roundRect(barX, baselineY - hBar, barWidth, hBar, 1.5 * scaleRef);
      else c.rect(barX, baselineY - hBar, barWidth, hBar);
      c.fill();
    }

  } else if (waveStyle === 'neon_stroke_wave') {
    const pointCount = 70;
    const step = totalWidth / (pointCount - 1);
    c.beginPath();
    for (let i = 0; i < pointCount; i++) {
      const bin = Math.floor((i / pointCount) * 110) + 1;
      const y = baselineY - Math.pow((rawData[bin] || 0) / 255, 1.6) * maxBarHeight * 1.35;
      if (i === 0) c.moveTo(startX, y);
      else c.lineTo(startX + i * step, y);
    }
    c.strokeStyle = Wv.color || '#00f2fe';
    c.lineWidth = 3.5 * scaleRef;
    c.shadowColor = Wv.color || '#00f2fe';
    c.shadowBlur = 18 * scaleRef;
    c.stroke();
    c.strokeStyle = '#ffffff';
    c.lineWidth = 1.2 * scaleRef;
    c.shadowBlur = 0;
    c.stroke();

  } else if (waveStyle === 'dual_mirror_columns') {
    const barCount = 80;
    const barWidth = (totalWidth / barCount) * 0.65;
    const barSpacing = (totalWidth - (barCount * barWidth)) / (barCount - 1);
    for (let i = 0; i < barCount; i++) {
      const bin = Math.floor((i / barCount) * 120) + 1;
      const hBar = Math.pow((rawData[bin] || 0) / 255, 1.5) * (maxBarHeight * 0.65);
      const barX = startX + i * (barWidth + barSpacing);
      c.fillStyle = '#ffffff';
      c.shadowColor = Wv.color || '#38bdf8';
      c.shadowBlur = 4 * scaleRef;
      c.beginPath();
      if(c.roundRect) c.roundRect(barX, baselineY - hBar, barWidth, hBar * 2, 1.2 * scaleRef);
      else c.rect(barX, baselineY - hBar, barWidth, hBar * 2);
      c.fill();
    }

  } else if (waveStyle === 'wave_peak_glow') {
    const pointCount = 54;
    const step = totalWidth / (pointCount - 1);
    let pts = [];
    for (let i = 0; i < pointCount; i++) {
      const bin = Math.floor((i / pointCount) * 120) + 1;
      pts.push({ x: startX + i * step, y: baselineY - Math.pow((rawData[bin] || 0) / 255, 1.5) * maxBarHeight });
    }
    c.beginPath();
    c.moveTo(startX, pts[0].y);
    for (let i = 0; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
    c.strokeStyle = Wv.color2 || '#f43f5e';
    c.lineWidth = 2.0 * scaleRef;
    c.shadowColor = Wv.color2 || '#f43f5e';
    c.shadowBlur = 10 * scaleRef;
    c.stroke();

    pts.forEach((p, idx) => {
      if (idx % 2 === 0) {
        c.fillStyle = '#ffffff';
        c.shadowColor = Wv.color2 || '#f43f5e';
        c.shadowBlur = 6 * scaleRef;
        c.beginPath();
        c.arc(p.x, p.y, 2.2 * scaleRef, 0, Math.PI * 2);
        c.fill();
      }
    });

  } else if (waveStyle === 'center_peak_bars') {
    const barCount = 90;
    const half = barCount / 2;
    const barWidth = (totalWidth / barCount) * 0.65;
    const barSpacing = (totalWidth - (barCount * barWidth)) / (barCount - 1);
    for (let i = 0; i < barCount; i++) {
      const distFromCenter = Math.abs(i - half) / half;
      const bin = Math.floor(distFromCenter * 90) + 1;
      const hBar = Math.pow((rawData[bin] || 0) / 255, 1.5) * maxBarHeight * (1 - distFromCenter * 0.2);
      const barX = startX + i * (barWidth + barSpacing);
      c.fillStyle = `hsl(${320 - distFromCenter * 140}, 100%, 70%)`;
      c.shadowColor = c.fillStyle;
      c.shadowBlur = 4 * scaleRef;
      c.beginPath();
      if(c.roundRect) c.roundRect(barX, baselineY - hBar, barWidth, hBar, 1.0 * scaleRef);
      else c.rect(barX, baselineY - hBar, barWidth, hBar);
      c.fill();
    }

  } else if (/^wire_(silk_thread|dual_helix|neon_thread|crystal_trace|aurora_flow|laser_ribbon|pulse_arc|glass_echo|infinity_loop|spectrum_thread)$/.test(waveStyle)) {
    // 10 LUXURY WIRE STYLES — designed specifically for Top + Bottom dual-wave layouts.
    // Thin, spacious linework keeps the frame elegant when mirrored vertically.
    const pts = 88;
    const step = totalWidth / Math.max(1, pts - 1);
    const amp = maxBarHeight * 0.92;
    const fall = Number(Wv.peakSpeed ?? Wv.fallSpeed ?? 0.07);
    const wire = (lineIndex, opts={}) => {
      const baseOffset = Number(opts.offset || 0) * scaleRef;
      const width = Number(opts.width || 2.2) * scaleRef;
      const glow = Number(opts.glow || 8) * scaleRef;
      const alpha = opts.alpha == null ? 1 : Number(opts.alpha);
      const phase = Number(opts.phase || 0);
      const freqWarp = Number(opts.freqWarp || 0);
      const ampMul = Number(opts.ampMul || 1);
      const useGradient = !!opts.gradient;
      c.save();
      c.globalAlpha = alpha;
      c.beginPath();
      for(let i=0;i<pts;i++){
        const n=i/(pts-1);
        const warped=Math.max(0,Math.min(1,n + freqWarp*Math.sin(n*Math.PI*2 + phase)*0.12));
        const bin=Math.min(255,mapBalladFrequencyBin(warped,Wv.frequencyMap));
        const raw=(rawData[bin]||0)/255;
        const v=Math.pow(raw,1.36);
        const hh=waveSmoothHeight(i, Math.max(0.8*scaleRef, v*amp*ampMul));
        const organic=Math.sin(n*Math.PI*2.2+phase)*2.2*scaleRef + Math.sin(n*Math.PI*5.1-phase*.7)*0.75*scaleRef;
        const y=baselineY - hh + baseOffset + organic;
        const x=startX+i*step;
        if(i===0)c.moveTo(x,y); else c.lineTo(x,y);
      }
      if(useGradient){
        const g=c.createLinearGradient(startX,0,endX,0);
        g.addColorStop(0,Wv.color||'#67e8f9');
        g.addColorStop(.5,Wv.color2||'#f0abfc');
        g.addColorStop(1,'#ffffff');
        c.strokeStyle=g;
      }else{
        c.strokeStyle=opts.color || Wv.color || '#67e8f9';
      }
      c.lineWidth=width;
      c.shadowColor=opts.shadow || Wv.color2 || Wv.color || '#ffffff';
      c.shadowBlur=glow;
      c.stroke();
      c.restore();
    };

    if(waveStyle==='wire_silk_thread'){
      wire(0,{width:2.0,glow:7,alpha:.92,gradient:true,ampMul:.82,phase:.1});
      wire(1,{width:.72,glow:2,alpha:.72,offset:-2.2,ampMul:.50,phase:1.0, color:'#ffffff', shadow:'#ffffff'});

    }else if(waveStyle==='wire_dual_helix'){
      wire(0,{width:1.9,glow:7,alpha:.9,offset:-3.5,ampMul:.88,phase:.0,gradient:true});
      wire(88,{width:1.55,glow:6,alpha:.82,offset:3.5,ampMul:.72,phase:Math.PI,gradient:true});

    }else if(waveStyle==='wire_neon_thread'){
      wire(176,{width:5.0,glow:15,alpha:.22,ampMul:.95,phase:.0,gradient:true});
      wire(176,{width:2.25,glow:7,alpha:1,ampMul:.95,phase:.0,gradient:true});
      wire(176,{width:.72,glow:1,alpha:.95,ampMul:.95,phase:.0,color:'#ffffff',shadow:'#ffffff'});

    }else if(waveStyle==='wire_crystal_trace'){
      wire(264,{width:1.9,glow:9,alpha:.96,ampMul:.90,phase:.18,gradient:true});
      for(let i=8;i<pts-8;i+=9){
        const n=i/(pts-1),bin=Math.min(255,mapBalladFrequencyBin(n,Wv.frequencyMap)),raw=(rawData[bin]||0)/255;
        const v=Math.pow(raw,1.28),hh=waveSmoothHeight(i,Math.max(0.8*scaleRef,v*amp*.90));
        const x=startX+i*step,y=baselineY-hh+Math.sin(n*Math.PI*2.2+.18)*2.2*scaleRef;
        const sz=(1.5+2.2*v)*scaleRef;
        c.save();c.translate(x,y);c.rotate(Math.PI/4);c.fillStyle=Wv.color2||'#ffffff';c.shadowColor=c.fillStyle;c.shadowBlur=7*scaleRef;c.fillRect(-sz/2,-sz/2,sz,sz);c.restore();
      }

    }else if(waveStyle==='wire_aurora_flow'){
      wire(352,{width:2.4,glow:11,alpha:.66,ampMul:.86,phase:0,gradient:true});
      wire(440,{width:1.55,glow:8,alpha:.78,offset:2.8,ampMul:.72,phase:.95,gradient:true});
      wire(528,{width:.9,glow:5,alpha:.68,offset:-2.8,ampMul:.60,phase:1.9,color:'#ffffff',shadow:Wv.color2||'#ffffff'});

    }else if(waveStyle==='wire_laser_ribbon'){
      wire(616,{width:1.65,glow:8,alpha:.94,offset:-4.5,ampMul:.82,phase:0,gradient:true,freqWarp:.30});
      wire(704,{width:1.65,glow:8,alpha:.82,offset:4.5,ampMul:.76,phase:Math.PI*.8,gradient:true,freqWarp:-.24});
      c.save();c.globalAlpha=.55;c.strokeStyle='#ffffff';c.lineWidth=.45*scaleRef;c.shadowBlur=0;c.beginPath();
      for(let i=0;i<pts;i++){
        const n=i/(pts-1),bin=Math.min(255,mapBalladFrequencyBin(n,Wv.frequencyMap)),v=Math.pow(((rawData[bin]||0)/255),1.34),hh=waveSmoothHeight(i,Math.max(0.6*scaleRef,v*amp*.82));
        const y=baselineY-hh+Math.sin(n*Math.PI*10)*.9*scaleRef,x=startX+i*step;if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
      }c.stroke();c.restore();

    }else if(waveStyle==='wire_pulse_arc'){
      wire(880,{width:2.35,glow:10,alpha:.94,ampMul:1.00,phase:0,gradient:true});
      wire(968,{width:.78,glow:3,alpha:.72,offset:-2.0,ampMul:.52,phase:1.3,color:'#ffffff',shadow:'#ffffff'});

    }else if(waveStyle==='wire_glass_echo'){
      wire(1056,{width:1.75,glow:8,alpha:.90,ampMul:.92,phase:.0,gradient:true});
      wire(1144,{width:1.10,glow:4,alpha:.36,offset:7.5,ampMul:.76,phase:.32,color:'#ffffff',shadow:Wv.color||'#67e8f9'});
      wire(1232,{width:.72,glow:2,alpha:.24,offset:13,ampMul:.60,phase:.68,color:Wv.color2||'#f0abfc',shadow:Wv.color2||'#f0abfc'});

    }else if(waveStyle==='wire_infinity_loop'){
      wire(1320,{width:1.65,glow:8,alpha:.90,ampMul:.84,phase:0,gradient:true,freqWarp:.38});
      wire(1408,{width:1.65,glow:8,alpha:.82,ampMul:.72,phase:Math.PI,gradient:true,freqWarp:-.38});

    }else if(waveStyle==='wire_spectrum_thread'){
      c.save();
      const p2=90;
      const st=totalWidth/(p2-1);
      c.beginPath();
      for(let i=0;i<p2;i++){
        const n=i/(p2-1),bin=Math.min(255,mapBalladFrequencyBin(n,Wv.frequencyMap));
        const bass=Math.pow((rawData[Math.min(40,bin)]||0)/255,1.30);
        const mid=Math.pow((rawData[Math.min(88,bin)]||0)/255,1.32);
        const high=Math.pow((rawData[Math.min(125,bin)]||0)/255,1.36);
        const v=Math.min(1,bass*.48+mid*.32+high*.20);
        const hh=waveSmoothHeight(i,Math.max(.8*scaleRef,v*amp*.96));
        const y=baselineY-hh+Math.sin(n*Math.PI*3.3)*1.25*scaleRef,x=startX+i*st;
        if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
      }
      const g=c.createLinearGradient(startX,0,endX,0);g.addColorStop(0,'#22d3ee');g.addColorStop(.34,Wv.color||'#38bdf8');g.addColorStop(.68,Wv.color2||'#f0abfc');g.addColorStop(1,'#fef3c7');
      c.strokeStyle=g;c.lineWidth=2.5*scaleRef;c.shadowColor=Wv.color2||'#ffffff';c.shadowBlur=11*scaleRef;c.stroke();
      c.restore();
    }
  } else if (waveStyle === 'interlaced_wave') {
    const pointCount = 60;
    const step = totalWidth / (pointCount - 1);
    for (let wIdx = 0; wIdx < 2; wIdx++) {
      c.beginPath();
      for (let i = 0; i < pointCount; i++) {
        const bin = Math.floor((i / pointCount) * 100) + 1;
        const factor = wIdx === 0 ? 1 : -0.4;
        const y = baselineY - (Math.pow((rawData[bin] || 0) / 255, 1.4) * maxBarHeight * factor);
        if (i === 0) c.moveTo(startX, y);
        else c.lineTo(startX + i * step, y);
      }
      c.strokeStyle = wIdx === 0 ? (Wv.color || '#38bdf8') : (Wv.color2 || '#fbbf24');
      c.lineWidth = 2.0 * scaleRef;
      c.shadowColor = c.strokeStyle;
      c.shadowBlur = 8 * scaleRef;
      c.stroke();
    }
  }

  endWaveSmoothFrame(t);
  c.restore();
}

function drawAveeWave(c,w,h,t){
  const Wv=state.wave;
  if(!Wv.enabled)return;
  const mode=Wv.layoutMode||'single';
  const singleCfg={x:Number(Wv.x??50),y:Number(Wv.y??92),widthScale:Number(Wv.widthScale??75),heightScale:Number(Wv.heightScale??1.4)};
  const topCfg={x:Number(Wv.topX??50),y:Number(Wv.topY??8),widthScale:Number(Wv.topWidthScale??Wv.widthScale??75),heightScale:Number(Wv.topHeightScale??Wv.heightScale??1.4)};
  const bottomCfg={x:Number(Wv.bottomX??Wv.x??50),y:Number(Wv.bottomY??Wv.y??92),widthScale:Number(Wv.bottomWidthScale??Wv.widthScale??75),heightScale:Number(Wv.bottomHeightScale??Wv.heightScale??1.4)};
  // Keep separate persistent peak states so Top/Bottom can have independent size and fall behavior.
  drawAveeWave._slotPeaks=drawAveeWave._slotPeaks||{
    top:{peakHeights:new Float32Array(TOTAL_PEAK_BARS).fill(0),peakSpeeds:new Float32Array(TOTAL_PEAK_BARS).fill(0)},
    bottom:{peakHeights:new Float32Array(TOTAL_PEAK_BARS).fill(0),peakSpeeds:new Float32Array(TOTAL_PEAK_BARS).fill(0)}
  };
  const oldX=Wv.x,oldY=Wv.y,oldWidth=Wv.widthScale,oldHeight=Wv.heightScale,oldSlot=waveActiveSlot,oldPeaksH=peakHeights,oldPeaksS=peakSpeeds;
  const drawSlot=(slot,cfg,flip)=>{
    Wv.x=cfg.x;Wv.y=cfg.y;Wv.widthScale=cfg.widthScale;Wv.heightScale=cfg.heightScale;
    waveActiveSlot=slot;
    if(slot!=='single'){peakHeights=drawAveeWave._slotPeaks[slot].peakHeights;peakSpeeds=drawAveeWave._slotPeaks[slot].peakSpeeds;}
    try{
      if(flip){
        const baseline=h*(cfg.y/100);
        c.save();
        c.translate(0,2*baseline);c.scale(1,-1);
        drawAveeWaveSingle(c,w,h,t);
        c.restore();
      }else{
        drawAveeWaveSingle(c,w,h,t);
      }
    }finally{
      if(slot!=='single'){
        drawAveeWave._slotPeaks[slot].peakHeights=peakHeights;
        drawAveeWave._slotPeaks[slot].peakSpeeds=peakSpeeds;
      }
    }
  };
  try{
    if(mode==='top') drawSlot('top',topCfg,true);
    else if(mode==='bottom') drawSlot('bottom',bottomCfg,false);
    else if(mode==='both'){drawSlot('top',topCfg,true);drawSlot('bottom',bottomCfg,false);}
    else drawSlot('single',singleCfg,false);
  }finally{
    Wv.x=oldX;Wv.y=oldY;Wv.widthScale=oldWidth;Wv.heightScale=oldHeight;
    waveActiveSlot=oldSlot;peakHeights=oldPeaksH;peakSpeeds=oldPeaksS;
  }
}

function lyricTransform(fx, phase, prog){
  let opacity=1, dx=0, dy=0, scale=1, rot=0, blur=0, reveal=1;
  const e = easeOutCubic(prog);
  if(phase==='in'){
    switch(fx){
      case 'fade': opacity=e; break;
      case 'slideup': opacity=e; dy=(1-e)*40; break;
      case 'slidedown': opacity=e; dy=-(1-e)*40; break;
      case 'slideleft': opacity=e; dx=(1-e)*60; break;
      case 'slideright': opacity=e; dx=-(1-e)*60; break;
      case 'zoomin': opacity=e; scale=lerp(0.5,1,e); break;
      case 'typewriter': opacity=1; reveal=prog; break;
      case 'bouncein': opacity=e; scale=1+Math.sin(prog*Math.PI)*0.25*(1-prog); break;
      case 'rotatein': opacity=e; rot=lerp(-12,0,e); break;
      case 'blurin': opacity=e; blur=(1-e)*10; break;
    }
  } else {
    const eo = easeOutCubic(prog);
    switch(fx){
      case 'fade': opacity=1-eo; break;
      case 'slideup': opacity=1-eo; dy=-(eo)*40; break;
      case 'slidedown': opacity=1-eo; dy=(eo)*40; break;
      case 'slideleft': opacity=1-eo; dx=-(eo)*60; break;
      case 'slideright': opacity=1-eo; dx=(eo)*60; break;
      case 'zoomout': opacity=1-eo; scale=lerp(1,1.6,eo); break;
      case 'shrink': opacity=1-eo; scale=lerp(1,0.3,eo); break;
      case 'bounceout': opacity=1-eo; scale=1+Math.sin(prog*Math.PI)*0.2; break;
      case 'rotateout': opacity=1-eo; rot=lerp(0,14,eo); break;
      case 'blurout': opacity=1-eo; blur=eo*10; break;
    }
  }
  return {opacity,dx,dy,scale,rot,blur,reveal};
}

function drawStyledText(c,text,x,y,fontPx,fontFam,color,borderColor,borderWidth,shadowColor,shadowBlur,align='center',weight=800){
  c.save();
  c.font = `${weight} ${fontPx}px ${fontFam}, sans-serif`;
  c.textAlign=align; c.textBaseline='middle';
  if(shadowBlur>0){ c.shadowColor=shadowColor; c.shadowBlur=shadowBlur; }
  if(borderWidth>0){ c.lineWidth=borderWidth*2; c.strokeStyle=borderColor; c.strokeText(text,x,y); }
  c.fillStyle=color; c.fillText(text,x,y);
  c.restore();
}

function getBeatMotion(t){
  const B=state.beatMotion;
  if(!B.enabled || !state.audio.beats?.length)
    return {scale:1,tx:0,ty:0,rotate:0,flash:0,energy:0};

  const bs=state.audio.beats, ss=state.audio.beatStrengths||[];
  let lo=0,hi=bs.length;
  while(lo<hi){const md=(lo+hi)>>1;if(bs[md]<t)lo=md+1;else hi=md;}

  let best=0;
  for(let j=Math.max(0,lo-2);j<Math.min(bs.length,lo+2);j++){
    const dt=t-bs[j];
    if(dt<-.04||dt>1.0)continue;

    // Fast attack, musical release. The "smoothness" control lengthens the tail
    // without smearing the exact beat hit.
    const releaseBase=Math.max(.07,B.decay||.24);
    const release=releaseBase*(0.72+0.55*Math.max(0,Math.min(1,B.smoothness??.82)));
    let env;
    if(dt<0){
      env=Math.max(0,(dt+.04)/.04);
      env=Math.pow(env,0.62);
    }else{
      env=Math.exp(-dt/release);
    }

    // Beat strength already comes from transient + low-end analysis.
    // impactCurve >1 makes strong drops stand out more.
    const st=Math.max(.04,Math.min(1,ss[j]||.42));
    const impacted=Math.pow(st,Math.max(.65,Math.min(1.7,B.impactCurve||1.18)));

/* =========================================================================
   RENDER SPEED - cache lop phu tinh (OPT 2026-11-09)
   Vignette va tieu de khong doi theo tung khung: ve 1 lan vao canvas phu roi
   drawImage lai moi khung, thay vi tao gradient / shadowBlur moi lan.
   ========================================================================= */
let _vigCache=null;
function drawVignetteCached(c,w,h){
  if(!_vigCache||_vigCache.w!==w||_vigCache.h!==h){
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cc=cv.getContext('2d');
    const vg=cc.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,h*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.35)');
    cc.fillStyle=vg; cc.fillRect(0,0,w,h);
    _vigCache={w:w,h:h,cv:cv};
  }
  c.drawImage(_vigCache.cv,0,0);
}

let _titleCache=null;
function drawTitleCached(c){
  const T=state.title;
  if(!T.show||!T.text) return;
  const fpx=H*(T.size/100);
  const tx=W*T.x/100, ty=H*T.y/100;
  const key=[T.text,tx,ty,fpx,T.font,T.color,T.borderColor,T.borderWidth,T.shadowColor,T.shadowBlur,W,H].join('\u0001');
  if(!_titleCache||_titleCache.key!==key){
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const cc=cv.getContext('2d');
    drawStyledText(cc,T.text,tx,ty,fpx,T.font,T.color,T.borderColor,T.borderWidth,T.shadowColor,T.shadowBlur,'center',800);
    _titleCache={key:key,cv:cv};
  }
  c.drawImage(_titleCache.cv,0,0);
}

let _renderSeq=null, _renderSegIndex=0;

function renderFrame(t){
  if(!ctx) return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

  if(sequence.length===0 && state.images.length>0) buildTimeline();

  // Doan dang chay: giu chi so, chi tim lai khi t ra khoi doan (scrub/doi timeline)
  let segIndex = _renderSegIndex;
  if(!_renderSeq || _renderSeq!==sequence || segIndex<0 || segIndex>=sequence.length || t<sequence[segIndex].start || t>=sequence[segIndex].end){
    segIndex = sequence.findIndex(s=> t>=s.start && t<s.end);
    _renderSeq=sequence; _renderSegIndex=segIndex;
  }
  if(segIndex === -1 && sequence.length) segIndex = t<sequence[0].start ? 0 : sequence.length-1;
  const seg = sequence[segIndex];

  let bm = null;
  if(seg){
    const p = Math.min(1, Math.max(0, (t-seg.start)/Math.max(0.001,(seg.end-seg.start))));
    const fx = getImageEffectTransform(seg.image.effect, p, t, seg);
    bm = getBeatMotion(t);
    const finalScale = state.beatMotion.zoomEnabled===false ? 1 : fx.scale*bm.scale;
    drawImageCover(ctx, seg.image, seg.image.offX, seg.image.offY, finalScale,
      fx.tx+bm.tx, fx.ty+bm.ty, fx.rotate+bm.rotate, fx.opacity, W, H, fx, (seg.end-seg.start)>=4);
  } else if(state.images.length){
    drawImageCover(ctx, state.images[0], state.images[0].offX, state.images[0].offY, 1,0,0,0,1,W,H, null);
  } else {
    const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#1c1830'); g.addColorStop(1,'#0a0a10');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.font=`600 ${W*0.035}px Inter`; ctx.textAlign='center';
    ctx.fillText('Thêm ảnh và nhạc để bắt đầu', W/2, H/2);
  }

  drawVignetteCached(ctx,W,H);

  const bmNow = bm || getBeatMotion(t);
  drawBeatFlash(ctx,W,H,Math.max(bmNow.flash,getFullFrameFlash(t)));

  drawAveeWave(ctx, W, H, t);
  drawWeatherFX(ctx, W, H, t);
  drawVinyl(ctx, W, H, t, bmNow);

  drawTitleCached(ctx);

  if(state.lyrics.enabled && state.lyrics.lines.length){
    const L=state.lyrics;
    const animDur=0.35;
    const visible=L.lines.filter(ln=>t>=ln.start-animDur && t<=ln.end+animDur).slice(0,L.visibleCount);
    const fpx=H*(L.size/100);
    visible.forEach((ln,idx)=>{
      let phase=null,prog=0;
      if(t<ln.start){phase='in';prog=Math.max(0,1-(ln.start-t)/animDur);}
      else if(t<=ln.end){phase='in';prog=1;}
      else {phase='out';prog=Math.min(1,(t-ln.end)/animDur);}
      const tr=lyricTransform(phase==='out'?L.exitFx:L.appearFx,phase,prog);
      const baseY=H*L.y/100+idx*(fpx*1.3);
      ctx.save();
      ctx.globalAlpha=Math.max(0,Math.min(1,tr.opacity));
      ctx.translate(W/2+tr.dx*(W/1080),baseY+tr.dy*(H/1920));
      ctx.rotate(tr.rot*Math.PI/180); ctx.scale(tr.scale,tr.scale);
      if(tr.blur>0.5)ctx.filter=`blur(${tr.blur}px)`;
      let text=ln.text;
      if(L.appearFx==='typewriter'&&phase==='in')text=ln.text.slice(0,Math.ceil(ln.text.length*tr.reveal));
      drawStyledText(ctx,text,0,0,fpx,L.font,L.color,L.borderColor,L.borderWidth,L.shadowColor,L.shadowBlur,'center',L.weight);
      const words=ln.words||[];
      if(L.karaokeEnabled!==false&&words.length&&phase==='in'&&t>=ln.start){
        const full=ln.text;
        const elapsed=Math.max(0,t-ln.start);
        const parts=words.map(w=>w.word).join(' ');
        let highlightCount=0;
        for(let wi=0;wi<words.length;wi++){if(t>=words[wi].end)highlightCount++;else if(t>=words[wi].start){highlightCount=wi+1;break;}}
        if(highlightCount>0){
          const tempFont=`${L.weight} ${fpx}px ${L.font}, sans-serif`;
          ctx.font=tempFont;ctx.textAlign='center';ctx.textBaseline='middle';
          const totalWidth=ctx.measureText(full).width;
          const prefix=words.slice(0,highlightCount).map(w=>w.word).join(' ');
          const prefixWidth=ctx.measureText(prefix).width;
          const left=-totalWidth/2;
          ctx.save();
          ctx.beginPath();ctx.rect(left-4,-fpx*.75,prefixWidth+8,fpx*1.5);ctx.clip();
          ctx.shadowColor=L.karaokeColor||'#ff9a36';ctx.shadowBlur=Number(L.karaokeGlow)||0;
          if(L.borderWidth>0){ctx.lineWidth=L.borderWidth*2;ctx.strokeStyle=L.karaokeColor||'#ff9a36';ctx.strokeText(full,0,0);}
          ctx.fillStyle=L.karaokeColor||'#ff9a36';ctx.fillText(full,0,0);
          ctx.restore();
        }
      }
      ctx.restore();
    });
  }}

function getCurTime(){
  const audioEl=document.getElementById('audioEl');
  if(state.audio.buffer) return audioEl.currentTime||0;
  return pauseAt;
}

function fmtTime(s){ s=Math.max(0,s||0); const m=Math.floor(s/60); const sec=Math.floor(s%60); return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }

document.getElementById('playBtn').addEventListener('click', togglePlay);
async function togglePlay(){
  if(directRendering){ return; }
  const audioEl=document.getElementById('audioEl');
  if(!state.audio.buffer){ return; }
  setupAudioGraph();
  if(audioCtx && audioCtx.state==='suspended') await audioCtx.resume();
  
  if(state.playing){
    audioEl.pause();
    state.playing=false;
  } else {
    try {
      await audioEl.play();
      state.playing=true;
    } catch(err){
      state.playing=false;
    }
  }
  document.getElementById('playIcon').innerHTML = state.playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  loopRender();
}

function loopRender(){
  cancelAnimationFrame(rafId);
  const audioEl=document.getElementById('audioEl');
  function step(){
    const t=getCurTime();
    renderFrame(t);
    updatePlayhead(t);
    if(state.playing && !audioEl.paused){ rafId=requestAnimationFrame(step); }
    else if(state.playing && audioEl.ended){ 
      state.playing=false; 
      document.getElementById('playIcon').innerHTML='<path d="M8 5v14l11-7z"/>';
      if(directRendering){ directRenderAbort=true; }
    }
  }
  step();
}
document.getElementById('audioEl').addEventListener('ended', ()=>{ 
  state.playing=false; 
  document.getElementById('playIcon').innerHTML='<path d="M8 5v14l11-7z"/>'; 
  if(directRendering){ directRenderAbort=true; }
});

function updatePlayhead(t){
  const dur=getTotalDuration()||1;
  const pct=Math.min(1,t/dur);
  document.getElementById('playhead').style.left=(pct*100)+'%';
  document.getElementById('timecode').textContent = fmtTime(t)+' / '+fmtTime(dur);
}

const timelineDiv=document.getElementById('timeline');
timelineDiv.addEventListener('click', e=>{
  if(directRendering) return;
  const rect=timelineDiv.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  const dur=getTotalDuration()||0;
  const t=pct*dur;
  const audioEl=document.getElementById('audioEl');
  if(state.audio.buffer) audioEl.currentTime=t; else pauseAt=t;
  renderFrame(t); updatePlayhead(t);
});

function drawTimelineCanvas(){
  const c=document.getElementById('timelineCanvas');
  const rect=timelineDiv.getBoundingClientRect();
  c.width=rect.width*2; c.height=rect.height*2;
  const tc=c.getContext('2d'); tc.scale(2,2);
  const w=rect.width,h=rect.height;
  tc.clearRect(0,0,w,h);
  tc.fillStyle='#191927'; tc.fillRect(0,0,w,h);
  const peaks=state.audio.peaks;
  const dur=getTotalDuration()||1;
  if(peaks && peaks.length){
    tc.fillStyle='#3a3a52';
    const bw=w/peaks.length;
    for(let i=0;i<peaks.length;i++){
      const bh=Math.max(1,peaks[i]*h*0.8);
      tc.fillRect(i*bw, (h-bh)/2, Math.max(1,bw-0.5), bh);
    }
  }
  if(state.audio.beats && state.audio.beats.length){
    tc.strokeStyle='rgba(124,92,255,.55)'; tc.lineWidth=1;
    state.audio.beats.forEach(b=>{ const x=(b/dur)*w; tc.beginPath(); tc.moveTo(x,0); tc.lineTo(x,h); tc.stroke(); });
  }
  if(sequence.length){
    sequence.forEach((s,i)=>{
      const x=(s.start/dur)*w, ww=((s.end-s.start)/dur)*w;
      tc.fillStyle = i%2? 'rgba(52,228,193,.14)':'rgba(124,92,255,.14)';
      tc.fillRect(x,h-6,Math.max(1,ww-1),6);
    });
  }
}

let dragMode=null;
let dragWaveSlot='single';
let draggingSeg=null, lastMouse=null;
let draggingVinylGroup=false;

canvas.addEventListener('mousedown', e=>{
  if(directRendering) return;
  const t=getCurTime();
  const seg = sequence.find(s=> t>=s.start && t<s.end);
  const rect=canvas.getBoundingClientRect();
  const px=(e.clientX-rect.left)*(W/Math.max(1,rect.width));
  const py=(e.clientY-rect.top)*(H/Math.max(1,rect.height));
  const mx=px/W, my=py/H;

  /* Vinyl gets first grab priority and uses true canvas-pixel hit testing. */
  if(state.vinyl?.enabled){
    const vm=getVinylMetrics(W,H);
    const dx=px-vm.cx,dy=py-vm.cy;
    const glowPad=Math.max(8,Math.min(W,H)*(Number(state.vinyl.glowStrength??55)/100)*.035);
    const inDisc=(dx*dx+dy*dy)<=Math.pow(vm.r+glowPad,2);
    const clockPx=H*(Number(state.vinyl.countdownSize??4.2)/100);
    const clockY=vm.cy+vm.r+(clockPx*.90)+(Number(state.vinyl.countdownGap??7)*(Math.min(W,H)/1000));
    const inClock=Math.abs(px-vm.cx)<Math.max(vm.r*.92,W*.05)&&Math.abs(py-clockY)<Math.max(clockPx*.72,H*.028);
    if(activeTab==='vinyl'||inDisc||inClock){
      dragMode='vinyl';draggingVinylGroup=true;lastMouse={x:mx,y:my};canvas.classList.add('panning');return;
    }
  }

  if(state.title.show && state.title.text){
    const tx = state.title.x / 100;
    const ty = state.title.y / 100;
    const isNearTitle = Math.abs(mx - tx) < 0.35 && Math.abs(my - ty) < 0.12;
    if(activeTab === 'title' || isNearTitle){
      dragMode = 'title';
      lastMouse = {x:mx, y:my};
      canvas.classList.add('panning');
      return;
    }
  }

  if(state.wave.enabled){
    // Che do 2 song: keo song nao thi sua song do (top/bottom), khong sua
    // wave.x/y cua che do 1 song nua.
    const wMode = state.wave.layoutMode || 'single';
    let slot = 'single';
    if(wMode === 'top') slot = 'top';
    else if(wMode === 'bottom') slot = 'bottom';
    else if(wMode === 'both'){
      const topY = Number(state.wave.topY ?? 8) / 100;
      const bottomY = Number(state.wave.bottomY ?? state.wave.y ?? 92) / 100;
      slot = Math.abs(my - topY) <= Math.abs(my - bottomY) ? 'top' : 'bottom';
    }
    const wx = (slot === 'top' ? Number(state.wave.topX ?? 50) : slot === 'bottom' ? Number(state.wave.bottomX ?? state.wave.x ?? 50) : state.wave.x) / 100;
    const wy = (slot === 'top' ? Number(state.wave.topY ?? 8) : slot === 'bottom' ? Number(state.wave.bottomY ?? state.wave.y ?? 92) : state.wave.y) / 100;
    const isNearWave = Math.abs(mx - wx) < 0.45 && Math.abs(my - wy) < 0.25;
    if(activeTab === 'wave' || isNearWave){
      dragMode = 'wave';
      dragWaveSlot = slot;
      lastMouse = {x:mx, y:my};
      canvas.classList.add('panning');
      return;
    }
  }

  if(activeTab==='images' && seg){
    dragMode='image'; draggingSeg=seg; lastMouse={x:mx,y:my}; canvas.classList.add('panning');
  }
});

    if(activeTab==='vinyl'){const xInp=document.getElementById('vinylX'),yInp=document.getElementById('vinylY'),xVal=document.getElementById('vinylXVal'),yVal=document.getElementById('vinylYVal');if(xInp)xInp.value=state.vinyl.x;if(yInp)yInp.value=state.vinyl.y;if(xVal)xVal.textContent=state.vinyl.x.toFixed(1)+'%';if(yVal)yVal.textContent=state.vinyl.y.toFixed(1)+'%';}
    lastMouse={x:mx,y:my};renderFrame(getCurTime());
  } else if(dragMode==='image' && draggingSeg && lastMouse){
    const dx=mx-lastMouse.x, dy=my-lastMouse.y;
    draggingSeg.image.offX = Math.max(0,Math.min(1, draggingSeg.image.offX - dx));
    draggingSeg.image.offY = Math.max(0,Math.min(1, draggingSeg.image.offY - dy));
    lastMouse={x:mx,y:my};
    renderFrame(getCurTime());
  }
});

    const projectUrl = URL.createObjectURL(content);
    a.href = projectUrl;
    a.download = `LumiVisualizerPro_${Date.now()}.lumivis`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(projectUrl),15000);
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg> Lưu dự án`;

  } catch (err) {
    alert('Lỗi khi lưu dự án: ' + err.message);
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg> Lưu dự án`;
  }
}

async function loadProject(file) {
  try {
    const zip = await JSZip.loadAsync(file);
    const configFile = zip.file("project.json");
    if (!configFile) throw new Error("Thiếu project.json trong file dự án!");

    const configText = await configFile.async("text");
    const proj = JSON.parse(configText);

    state.aspect = proj.aspect || '169';
    setAspect(state.aspect);
    state.batchConfig = proj.batchConfig || state.batchConfig;
    state.title = proj.title || state.title;
    state.lyrics = proj.lyrics || state.lyrics;
    state.wave = proj.wave || state.wave;
    if (proj.vinyl) {
      if(state.vinyl && state.vinyl.imageSrc && String(state.vinyl.imageSrc).startsWith('blob:')){ try{ URL.revokeObjectURL(state.vinyl.imageSrc); }catch(_){} }
      state.vinyl={...state.vinyl,...proj.vinyl,imageSrc:'',imageBlob:null,image:null};
      state.vinyl.glowColor=state.vinyl.glowColor||'#d8b26e';
      state.vinyl.material=state.vinyl.material||'glossy';
      state.vinyl.tilt3d=Number.isFinite(Number(state.vinyl.tilt3d))?Number(state.vinyl.tilt3d):0;
      state.vinyl.edgeDepth=Number.isFinite(Number(state.vinyl.edgeDepth))?Number(state.vinyl.edgeDepth):42;
      state.vinyl.glowStrength=Number.isFinite(Number(state.vinyl.glowStrength))?Number(state.vinyl.glowStrength):55;
      state.vinyl.ringStrength=Number.isFinite(Number(state.vinyl.ringStrength))?Number(state.vinyl.ringStrength):65;
      state.vinyl.ringBeat=Number.isFinite(Number(state.vinyl.ringBeat))?Number(state.vinyl.ringBeat):55;
      state.vinyl.shadowStrength=Number.isFinite(Number(state.vinyl.shadowStrength))?Number(state.vinyl.shadowStrength):50;
      state.vinyl.lacquer=Number.isFinite(Number(state.vinyl.lacquer))?Number(state.vinyl.lacquer):78;
      state.vinyl.reflection=Number.isFinite(Number(state.vinyl.reflection))?Number(state.vinyl.reflection):72;
      state.vinyl.rimLight=Number.isFinite(Number(state.vinyl.rimLight))?Number(state.vinyl.rimLight):82;
      state.vinyl.haloSoftness=Number.isFinite(Number(state.vinyl.haloSoftness))?Number(state.vinyl.haloSoftness):68;
      state.vinyl.faceDepth=Number.isFinite(Number(state.vinyl.faceDepth))?Number(state.vinyl.faceDepth):48;
      state.vinyl.imageOffsetX=Number.isFinite(Number(state.vinyl.imageOffsetX))?Number(state.vinyl.imageOffsetX):0;
      state.vinyl.imageOffsetY=Number.isFinite(Number(state.vinyl.imageOffsetY))?Number(state.vinyl.imageOffsetY):0;
      state.vinyl.beatPulse=Number.isFinite(Number(state.vinyl.beatPulse))?Number(state.vinyl.beatPulse):42;
      state.vinyl.countdownStyle=state.vinyl.countdownStyle||'hud';
      state.vinyl.countdownWeight=Number.isFinite(Number(state.vinyl.countdownWeight))?Number(state.vinyl.countdownWeight):800;
      state.vinyl.countdownTracking=Number.isFinite(Number(state.vinyl.countdownTracking))?Number(state.vinyl.countdownTracking):1.5;
      state.vinyl.countdownOpacity=Number.isFinite(Number(state.vinyl.countdownOpacity))?Number(state.vinyl.countdownOpacity):100;
      state.vinyl.countdownGlass=Number.isFinite(Number(state.vinyl.countdownGlass))?Number(state.vinyl.countdownGlass):42;
      state.vinyl.countdownBorder=Number.isFinite(Number(state.vinyl.countdownBorder))?Number(state.vinyl.countdownBorder):48;
      state.vinyl.countdownRule=Number.isFinite(Number(state.vinyl.countdownRule))?Number(state.vinyl.countdownRule):35;
      state.vinyl.countdownPulse=Number.isFinite(Number(state.vinyl.countdownPulse))?Number(state.vinyl.countdownPulse):28;
      state.vinyl.countdownProgress=Number.isFinite(Number(state.vinyl.countdownProgress))?Number(state.vinyl.countdownProgress):28;
      if(proj.vinyl.imageFileName){const vf=zip.file(`vinyl/${proj.vinyl.imageFileName}`);if(vf){const vb=await vf.async('blob'),vu=URL.createObjectURL(vb),vi=new Image();vi.src=vu;await new Promise(r=>{vi.onload=r;vi.onerror=r;});if(vi.naturalWidth){state.vinyl.imageSrc=vu;state.vinyl.imageBlob=vb;state.vinyl.image=vi;}}}
    }
    if (proj.beatMotion) Object.assign(state.beatMotion, proj.beatMotion);
    if (proj.weatherFX && typeof weatherFX!=='undefined') { Object.assign(weatherFX, proj.weatherFX); weatherFX.dustColor=weatherFX.dustColor||'#d8c2a1'; weatherFX.sparkleColor=weatherFX.sparkleColor||'#dff6ff'; weatherFX.rainColor=weatherFX.rainColor||'#bfe5ff'; weatherFX.bokehColor=weatherFX.bokehColor||'#fff1c7'; weatherFX.bokehStyle=weatherFX.bokehStyle||'soft'; }
    if (proj.audioMeta && proj.audioMeta.analysisSensitivity) beatAnalysisSensitivity = Number(proj.audioMeta.analysisSensitivity)||1.4;

    if (proj.audioMeta && proj.audioMeta.fileName) {
      const aFile = zip.file(proj.audioMeta.savedFileName || proj.audioMeta.fileName);
      if (aFile) {
        const aBlob = await aFile.async("blob");
        const aObjFile = new File([aBlob], proj.audioMeta.fileName, { type: aBlob.type });
        await loadAudio(aObjFile);
        if (proj.audioMeta.beats) state.audio.beats = proj.audioMeta.beats;
        if (proj.audioMeta.beatStrengths) state.audio.beatStrengths = proj.audioMeta.beatStrengths;
        if (proj.audioMeta.peaks) state.audio.peaks = proj.audioMeta.peaks;
        if (proj.audioMeta.bpm!=null) state.audio.bpm = proj.audioMeta.bpm;
        if (proj.audioMeta.analysisSensitivity) beatAnalysisSensitivity = Number(proj.audioMeta.analysisSensitivity)||1.4;
      }
    }

    // Giai phong URL blob cua anh cu truoc khi nap anh moi (tranh ro ri bo nho).
    for(const old of (state.images||[])){ if(old && old.src && String(old.src).startsWith('blob:')){ try{ URL.revokeObjectURL(old.src); }catch(_){} } }
    state.images = [];
    if (proj.images && proj.images.length > 0) {
      for (const imData of proj.images) {
        const imgFile = zip.file(`images/${imData.savedFileName}`);
        if (imgFile) {
          const blob = await imgFile.async("blob");
          const url = URL.createObjectURL(blob);
          const imgObj = new Image();
          imgObj.src = url;
          await new Promise(r => { imgObj.onload = r; imgObj.onerror = r; });
          if(!imgObj.naturalWidth){ try{ URL.revokeObjectURL(url); }catch(_){} continue; }

          state.images.push({
            id: imData.id || ('im' + Math.random().toString(36).slice(2)),
            src: url,
            img: imgObj,
            fileBlob: blob,
            fileName: imData.savedFileName,
            duration: imData.duration,
            effect: imData.effect,
            transitionDur: imData.transitionDur || 0.5,
            offX: Number.isFinite(Number(imData.offX)) ? Number(imData.offX) : 0.5,
            offY: Number.isFinite(Number(imData.offY)) ? Number(imData.offY) : 0.5,
            zoom: Number.isFinite(Number(imData.zoom)) ? Number(imData.zoom) : 1
          });
        }
      }
    }

    if (proj.shortCutConfig && typeof shortCutState!=='undefined') {
      const scCfg=proj.shortCutConfig;
      if (scCfg.savedFileName) {
        const scEntry=zip.file(scCfg.savedFileName);
        if (scEntry) {
          const scBlob=await scEntry.async('blob');
          const scName=scCfg.name || 'short_audio_source';
          await loadShortCutFile(new File([scBlob],scName,{type:scBlob.type||'audio/mpeg'}));
        }
      }
      if (shortCutState.duration) {
        shortCutState.start=Math.max(0,Math.min(Number(scCfg.start)||0,shortCutState.duration));
        const requestedEnd=Number(scCfg.end)||shortCutState.duration;
        shortCutState.end=Math.max(shortCutState.start,Math.min(requestedEnd,shortCutState.duration));
        if(shortCutState.end-shortCutState.start<0.05) shortCutState.end=Math.min(shortCutState.duration,shortCutState.start+0.05);
      }
      setTimeout(()=>{
        const fi=document.getElementById('shortCutFadeIn'), fo=document.getElementById('shortCutFadeOut'), fe=document.getElementById('shortCutFadeEnabled');
        if(fi) fi.value=Number(scCfg.fadeIn ?? 0.8);
        if(fo) fo.value=Number(scCfg.fadeOut ?? 1.2);
        if(fe) fe.checked=scCfg.fadeEnabled !== false;
        updateShortCutUI();
      },0);
    }
    buildTimeline();
    renderPanel();
    renderFrame(0);
    alert('Đã khôi phục toàn bộ dự án thành công!');

  } catch (err) {
    alert('Lỗi nạp dự án: ' + err.message);
  }
}

/* =========================================================================
   DIRECT MP4 RENDER ENGINE
   Render offline từng frame + WebCodecs + mp4-muxer.
   Không dùng canvas.captureStream/MediaRecorder.
========================================================================= */
let directRendering=false;
let directRenderAbort=false;
let renderInBackground=false;
let renderKeepAliveWorker=null;
let renderStartTime=0;

document.getElementById('recordBtn').addEventListener('click',startDirectRender);
document.getElementById('renderStopBtn').addEventListener('click',()=>{directRenderAbort=true;});

function renderUI(pct,status,eta){
  document.getElementById('renderProgressFill').style.width=Math.max(0,Math.min(100,pct))+'%';
  document.getElementById('renderPercent').textContent=(pct||0).toFixed(1)+'%';
  document.getElementById('renderStatusText').textContent=status||'';
  document.getElementById('renderETA').textContent='ETA '+(eta||'--:--');
}
function clk(s){s=Math.max(0,Math.round(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
// Doi encoder xa hang bang su kien 'dequeue' thay vi quay vong while+uiYield
// (vong while cu chay lien tuc nen ngon CPU). Timeout 250ms la luoi an toan
// cho trinh duyet khong ban su kien dequeue hoac encoder gap loi.
function waitForEncoderDrain(enc, threshold){
  return new Promise(res=>{
    if(!enc || enc.encodeQueueSize<=threshold) return res();
    let done=false;
    const finish=()=>{ if(done) return; done=true; try{ enc.removeEventListener('dequeue', onDequeue); }catch(_){} res(); };
    const onDequeue=()=>{ if(enc.encodeQueueSize<=threshold) finish(); };
    try{ enc.addEventListener('dequeue', onDequeue); }catch(_){}
    if(enc.encodeQueueSize<=threshold) return finish();
    setTimeout(finish, 250);
  });
}
const uiYield=()=>new Promise(resolve=>{
  // Do not use setTimeout/requestAnimationFrame for the render loop:
  // hidden tabs can throttle those timers. MessageChannel/microtask keeps the
  // offline render progressing without relying on foreground timer cadence.
  if(window.MessageChannel){
    const ch=new MessageChannel();
    ch.port1.onmessage=()=>{ ch.port1.close(); ch.port2.close(); resolve(); };
    ch.port2.postMessage(0);
  }else{
    queueMicrotask(resolve);
  }
});


function startRenderKeepAlive(){
  if(renderKeepAliveWorker) return;
  const src = `
    let timer=null;
    self.onmessage = e => {
      if(e.data==='start'){
        clearInterval(timer);
        timer=setInterval(()=>postMessage('tick'), 250);
      } else if(e.data==='stop'){
        clearInterval(timer); timer=null;
      }
    };
  `;
  try{
    const blob=new Blob([src],{type:'text/javascript'});
    renderKeepAliveWorker=new Worker(URL.createObjectURL(blob));
    renderKeepAliveWorker.onmessage=()=>{ if(directRendering) window.dispatchEvent(new Event('renderKeepAlive')); };
    renderKeepAliveWorker.postMessage('start');
  }catch(e){
    renderKeepAliveWorker=null;
  }
}
function stopRenderKeepAlive(){
  if(!renderKeepAliveWorker)return;
  try{renderKeepAliveWorker.postMessage('stop');renderKeepAliveWorker.terminate();}catch(e){}
  renderKeepAliveWorker=null;
}
function showBackgroundRenderBadge(show){
  const b=document.getElementById('backgroundRenderBadge');
  if(b)b.style.display=show?'block':'none';
}
document.addEventListener('visibilitychange',()=>{
  if(directRendering){
    renderInBackground=document.hidden;
    showBackgroundRenderBadge(renderInBackground);
  }
});
window.addEventListener('renderKeepAlive',()=>{});

async function startDirectRender(){
  if(directRendering)return;
  if(!state.audio.buffer){alert('Vui lòng thêm bài hát trước khi render.');return;}
  if(!state.images.length){alert('Vui lòng thêm ít nhất 1 ảnh.');return;}
  buildTimeline();
  if(!sequence.length){alert('Timeline chưa sẵn sàng.');return;}
  if(!window.VideoEncoder||!window.AudioEncoder||!window.VideoFrame){
    alert('Chrome/Edge hiện tại chưa hỗ trợ WebCodecs. Hãy cập nhật trình duyệt.');
    return;
  }
  // Hỏi vị trí lưu NGAY khi bấm render (còn trong thao tác bấm của người dùng):
  // hộp chọn file của trình duyệt chỉ mở được khi còn gesture, mà render thì
  // chạy nhiều phút nên không thể hỏi sau khi render xong.
  const musicBase=(state.audio.fileName||'LumiVisualizerPro').replace(/\.[^/.]+$/,'').replace(/[\\/:*?"<>|]/g,'_');
  const saveFileName=`${musicBase}.mp4`;
  let saveHandle=null;
  if(window.showSaveFilePicker){
    try{
      saveHandle=await window.showSaveFilePicker({suggestedName:saveFileName,types:[{description:'MP4 video',accept:{'video/mp4':['.mp4']}}]});
    }catch(e){
      if(e&&e.name==='AbortError')return; // bấm Hủy: không render nữa
      saveHandle=null; // lỗi khác: render tiếp, cuối render sẽ tải về kiểu cũ
    }
  }
  let M;
  try{ M=await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm'); }
  catch(e){alert('Không tải được MP4 Muxer. Cần Internet lần đầu để tải bộ mã hóa.');return;}

  directRendering=true;directRenderAbort=false;renderInBackground=document.hidden;renderStartTime=performance.now();showBackgroundRenderBadge(renderInBackground);
  const overlay=document.getElementById('directRenderOverlay');overlay.style.display='flex';
  renderUI(0,document.hidden?'Render nền • có thể chuyển tab/minimize • không đóng tab':'Khởi tạo MP4...','--:--');

  const {Muxer,ArrayBufferTarget}=M;
  let ve=null, ae=null, audioEl=null, oldTime=0, wasPlaying=false;
  try{
    const fps=30, ab=state.audio.buffer;
    const vcodec=(W*H>=3840*2160)?'avc1.640033':'avc1.640028';
    const vcfg={codec:vcodec,width:W,height:H,bitrate:(W*H>=2073600?9000000:6000000),framerate:fps};
    if(!(await VideoEncoder.isConfigSupported(vcfg)).supported) throw new Error('H.264 VideoEncoder không hỗ trợ độ phân giải này.');
    const acfg={codec:'mp4a.40.2',sampleRate:ab.sampleRate,numberOfChannels:ab.numberOfChannels,bitrate:192000};
    if(!(await AudioEncoder.isConfigSupported(acfg)).supported) throw new Error('AAC AudioEncoder không khả dụng trên trình duyệt này.');

    const target=new ArrayBufferTarget();
    const muxer=new Muxer({
      target,video:{codec:'avc',width:W,height:H},audio:{codec:'aac',sampleRate:ab.sampleRate,numberOfChannels:ab.numberOfChannels},
      fastStart:'in-memory'
    });
    ve=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>console.error(e)});
    ae=new AudioEncoder({output:(chunk,meta)=>muxer.addAudioChunk(chunk,meta),error:e=>console.error(e)});
    ve.configure(vcfg);ae.configure(acfg);

    const total=state.audio.duration,totalFrames=Math.ceil(total*fps);
    audioEl=document.getElementById('audioEl'); oldTime=audioEl.currentTime||0; wasPlaying=state.playing;
    audioEl.pause();state.playing=false;cancelAnimationFrame(rafId);

    for(let i=0;i<totalFrames;i++){
      if(directRenderAbort)throw new Error('__STOP__');
      const t=Math.min(total-0.000001,i/fps);
      renderFrame(t);
      const vf=new VideoFrame(canvas,{timestamp:Math.round(t*1e6),duration:Math.round(1e6/fps)});
      ve.encode(vf,{keyFrame:i===0||i%fps===0});vf.close();
      if(ve.encodeQueueSize>8)while(ve.encodeQueueSize>4)await waitForEncoderDrain(ve,4);
      if(i%15===0){
        const elapsed=(performance.now()-renderStartTime)/1000;
        const rate=t/Math.max(.01,elapsed),eta=(total-t)/Math.max(.01,rate);
        renderUI(i/totalFrames*82,`Render frame ${i+1}/${totalFrames} • ${rate.toFixed(2)}x realtime`,clk(eta));
        await uiYield();
      }
    }
    await ve.flush();ve.close();

    const ch=ab.numberOfChannels,nf=1024;
    for(let off=0;off<ab.length;off+=nf){
      if(directRenderAbort)throw new Error('__STOP__');
      const n=Math.min(nf,ab.length-off), planar=new Float32Array(n*ch);
      for(let c=0;c<ch;c++)planar.set(ab.getChannelData(c).subarray(off,off+n),c*n);
      const ad=new AudioData({format:'f32-planar',sampleRate:ab.sampleRate,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(off/ab.sampleRate*1e6),data:planar});
      ae.encode(ad);ad.close();
      if(ae.encodeQueueSize>8)await uiYield();
      if(off%(nf*32)===0)renderUI(82+off/ab.length*15,`Mã hóa audio AAC ${Math.round(off/ab.length*100)}%`,'00:01');
    }
    await ae.flush();ae.close();
    renderUI(98,'Đóng gói MP4...','00:01');await uiYield();muxer.finalize();

    const blob=new Blob([target.buffer],{type:'video/mp4'});
    let savedToPicker=false;
    if(saveHandle){
      try{
        const w=await saveHandle.createWritable();
        await w.write(blob);
        await w.close();
        savedToPicker=true;
      }catch(e){ console.error('Lưu MP4 qua hộp chọn file lỗi, tải về kiểu cũ:',e); saveHandle=null; }
    }
    if(!saveHandle){
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=saveFileName;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    }
    renderUI(100,savedToPicker?'Hoàn tất — MP4 đã lưu':'Hoàn tất — MP4 render trực tiếp','DONE');
    await new Promise(r=>setTimeout(r,700));
  }catch(e){
    if(e.message==='__STOP__')alert('Đã dừng render.');
    else{console.error(e);alert('Render trực tiếp lỗi: '+e.message);}
  }finally{
    try{if(ve && ve.state!=='closed')ve.close();}catch(_){}
    try{if(ae && ae.state!=='closed')ae.close();}catch(_){}
    directRendering=false;directRenderAbort=false;renderInBackground=false;showBackgroundRenderBadge(false);overlay.style.display='none';
    if(wasPlaying && audioEl){
      try{audioEl.currentTime=oldTime;await audioEl.play();state.playing=true;loopRender();}
      catch(_){state.playing=false;}
    }
  }
}

</script>
